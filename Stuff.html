<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHouse — Stuff</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0d101e}
#vhs-demo3{font-family:Arial,sans-serif;color:#f5e8d6;max-width:900px;margin:0 auto;padding:16px}
#vhs-demo3 *{box-sizing:border-box}
#vhs-demo3 button{font:inherit;cursor:pointer}
#vhs-demo3 .shell{border:2px solid #c29a62;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 40% 10%,#413149,#161525 75%)}
#vhs-demo3 .head{display:flex;align-items:center;justify-content:space-between;background:#151321df;border-bottom:1px solid #a08055;padding:12px 14px;gap:8px}
#vhs-demo3 .eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:#cba875}
#vhs-demo3 h2{font:700 clamp(22px,4vw,31px) Georgia,serif;color:#ffe2ac;margin:2px 0}
#vhs-demo3 .balances{display:flex;gap:7px}
#vhs-demo3 .balance{border:1px solid #92734d;background:#10111f;padding:7px 10px;border-radius:6px;text-align:center;min-width:67px}
#vhs-demo3 .balance small{display:block;color:#cbb592;font-size:10px;white-space:nowrap}
#vhs-demo3 .balance strong{display:block;color:#ffe0a1;font-size:16px;margin-top:3px}
#vhs-demo3 .area{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:10px;padding:12px}
#vhs-demo3 .panel{min-width:0;border:1px solid #857052;border-radius:7px;background:linear-gradient(145deg,#2e283c,#171725);overflow:hidden}
#vhs-demo3 .panelhead{padding:10px;background:#191728;border-bottom:1px solid #776042;font:700 clamp(13px,2.3vw,19px) Georgia,serif;color:#ffe0a6}
#vhs-demo3 .stats{padding:11px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-y}
#vhs-demo3 .stats::-webkit-scrollbar{display:none;width:0;height:0}
#vhs-demo3 .vcard-name{position:relative;flex:none;border:1px solid #ffe6b5;border-radius:6px;padding:10px;background:linear-gradient(#ffe9b2 0%,#e6bf80 48%,#c89b5b 49%,#b6894e 100%);box-shadow:0 2px 0 #80633f,0 3px 0 #f5d49b,0 4px 6px #0006,inset 0 1px 1px #fff9;text-align:center;color:#000}
#vhs-demo3 .vcard-name small{display:block;color:#000;font-size:10px;margin-bottom:5px}
#vhs-demo3 .vcard-name strong{display:block;font-size:15px;color:#000;overflow-wrap:anywhere}
#vhs-demo3 .statrow{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px solid #6c5a684f;font-size:12px}
#vhs-demo3 .statrow span{color:#d6cad6}
#vhs-demo3 .statrow strong{color:#ffdb9b;text-align:right}
#vhs-demo3 .inventory{height:242px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-y}
#vhs-demo3 .inventory::-webkit-scrollbar{display:none;width:0;height:0}
#vhs-demo3 .slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:9px}
#vhs-demo3 .slot{min-width:0;min-height:101px;padding:8px 3px;border:1px solid #6b5c73;border-radius:6px;background:linear-gradient(#302839,#191a29);color:#f4e8d9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;text-align:center}
#vhs-demo3 .slot:hover{border-color:#f6d291}
#vhs-demo3 .slot.selected{border:2px solid #ffdb93;background:linear-gradient(#4d394b,#242034)}
#vhs-demo3 .slot:focus-visible{outline:2px solid #ffe0a6;outline-offset:-2px}
#vhs-demo3 .itemicon{font-size:28px}
#vhs-demo3 .itemname{font-size:11px;line-height:1.2;font-weight:800}
#vhs-demo3 .qty{font-size:10px;color:#f8d49b}
#vhs-demo3 .details{margin:0 9px 9px;background:#171523;border:1px solid #79654e;border-radius:6px;padding:10px;min-height:65px}
#vhs-demo3 .details strong{font-size:13px;color:#ffe0a6}
#vhs-demo3 .details p{font-size:11px;line-height:1.4;color:#d7cbd8;margin:5px 0 0}
@media(max-width:460px){
#vhs-demo3{padding:6px}
#vhs-demo3 .head{padding:8px}
#vhs-demo3 .balance{padding:5px;min-width:57px}
#vhs-demo3 .balance strong{font-size:13px}
#vhs-demo3 .area{padding:7px;gap:6px}
#vhs-demo3 .panelhead{padding:8px 5px}
#vhs-demo3 .stats{padding:6px;gap:4px}
#vhs-demo3 .vcard-name{padding:7px 4px}
#vhs-demo3 .vcard-name strong{font-size:12px}
#vhs-demo3 .statrow{font-size:10px;padding:8px 0}
#vhs-demo3 .inventory{height:213px}
#vhs-demo3 .slots{gap:4px;padding:5px}
#vhs-demo3 .slot{min-height:86px;padding:5px 2px;gap:3px}
#vhs-demo3 .itemicon{font-size:22px}
#vhs-demo3 .itemname{font-size:9px}
#vhs-demo3 .details{margin:0 5px 5px;padding:6px}
}

/* Fit the same Stuff interface into the existing VHouse menu's content area. */
#vhs-demo3.embedded {
  width:100%; height:100%; max-width:none; padding:0; margin:0;
  overflow:hidden; container-type:inline-size;
}
#vhs-demo3.embedded .shell {
  width:100%; height:100%; display:flex; flex-direction:column;
  border:1px solid #bc9357; border-radius:.65cqw;
}
#vhs-demo3.embedded .head { flex:0 0 auto; padding:.45cqw .7cqw; }
#vhs-demo3.embedded .eyebrow { font-size:clamp(8px,1.15cqw,12px); letter-spacing:.14em; }
#vhs-demo3.embedded h2 { font-size:clamp(16px,2.7cqw,23px); margin:0; }
#vhs-demo3.embedded .balance { min-width:0; padding:.3cqw .6cqw; }
#vhs-demo3.embedded .balance small { font-size:clamp(8px,1.15cqw,11px); }
#vhs-demo3.embedded .balance strong { font-size:clamp(11px,1.7cqw,17px); margin-top:.15cqw; }
#vhs-demo3.embedded .area { flex:1; min-height:0; padding:.55cqw; gap:.55cqw; }
#vhs-demo3.embedded .panel { min-height:0; height:100%; display:flex; flex-direction:column; }
#vhs-demo3.embedded .panelhead { flex:0 0 auto; padding:.55cqw; font-size:clamp(10px,1.5cqw,15px); }
#vhs-demo3.embedded .stats { flex:1; min-height:0; padding:.5cqw; gap:.3cqw; }
#vhs-demo3.embedded .vcard-name { padding:.45cqw; }
#vhs-demo3.embedded .vcard-name small { font-size:clamp(8px,1cqw,10px); margin-bottom:2px; }
#vhs-demo3.embedded .vcard-name strong { font-size:clamp(10px,1.5cqw,15px); }
#vhs-demo3.embedded .statrow { font-size:clamp(9px,1.2cqw,12px); padding:.3cqw 1px; }
#vhs-demo3.embedded .inventory { flex:1; min-height:0; height:auto; overflow-y:auto; }
#vhs-demo3.embedded .slots { gap:.45cqw; padding:.5cqw; }
#vhs-demo3.embedded .slot { min-height:clamp(50px,7.3cqw,75px); padding:.4cqw .2cqw; gap:.25cqw; }
#vhs-demo3.embedded .itemicon { font-size:clamp(16px,2.7cqw,25px); }
#vhs-demo3.embedded .itemname { font-size:clamp(9px,1.2cqw,12px); }
#vhs-demo3.embedded .qty { font-size:clamp(8px,1.1cqw,11px); }
#vhs-demo3.embedded .details { flex:0 0 auto; min-height:0; margin:0 .5cqw .5cqw; padding:.5cqw; }
#vhs-demo3.embedded .details strong { font-size:clamp(10px,1.3cqw,13px); }
#vhs-demo3.embedded .details p { font-size:clamp(9px,1.1cqw,11px); margin-top:.3cqw; line-height:1.2; }

/* Read-only inventory capsules and item reveal, adapted from Shop Mission Boosts. */
#vhs-demo3{position:relative;isolation:isolate;container-type:inline-size}
#vhs-demo3 .vhs-boost-item{position:relative;display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;background:none;border:0;padding:0;cursor:pointer;color:inherit;transition:transform .25s}
#vhs-demo3 .vhs-boost-item:hover,#vhs-demo3 .vhs-boost-item:focus-visible{transform:translateY(-.9cqw)}
#vhs-demo3 .vhs-boost-dome{flex:1;min-height:0;width:100%;border:1px solid #887450;border-radius:50% 50% .7cqw .7cqw / 38% 38% .7cqw .7cqw;background:radial-gradient(ellipse at 50% 80%,#49384f,#211b30 65%,#181525);position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate;box-shadow:inset 5px 3px 12px #ffffff13;transition:box-shadow .3s,border-color .3s}
#vhs-demo3 .vhs-boost-dome:before{content:'';position:absolute;left:13%;top:14%;width:12%;height:37%;border-radius:50%;background:linear-gradient(#ffffff45,transparent);transform:rotate(15deg)}
#vhs-demo3 .vhs-boost-aura{position:absolute;inset:15% 0 5%;background:radial-gradient(ellipse,var(--energy),transparent 65%);opacity:.19;filter:blur(.9cqw);transition:opacity .2s}
#vhs-demo3 .vhs-boost-item:hover .vhs-boost-aura,#vhs-demo3 .vhs-boost-item:focus-visible .vhs-boost-aura{opacity:.7;animation:vhs-boost-breath 1s ease-in-out infinite alternate}
#vhs-demo3 .vhs-boost-item:hover .vhs-boost-dome,#vhs-demo3 .vhs-boost-item:focus-visible .vhs-boost-dome{border-color:var(--energy);box-shadow:0 0 1.2cqw var(--energy),inset 0 -.8cqw 2.3cqw color-mix(in srgb,var(--energy) 45%,transparent)}
#vhs-demo3 .vhs-boost-symbol{position:relative;z-index:3;display:grid;place-items:center;width:70%;height:65%;min-height:0;font-size:5.9cqw;line-height:1;filter:drop-shadow(0 .5cqw .6cqw #181525);animation:vhs-boost-float 2.8s ease-in-out infinite}
#vhs-demo3 .vhs-boost-symbol .zshop-item-art{display:grid;place-items:center;width:100%;height:100%;min-height:0;font:inherit}
#vhs-demo3 .vhs-boost-symbol img{object-fit:contain;width:100%;height:100%}
#vhs-demo3 .vhs-boost-item:hover .vhs-boost-symbol,#vhs-demo3 .vhs-boost-item:focus-visible .vhs-boost-symbol{filter:drop-shadow(0 0 1.1cqw var(--energy))}
#vhs-demo3 .vhs-boost-base{position:absolute;bottom:7%;left:8%;width:84%;height:17%;border:1px solid #887450;border-radius:50%;background:linear-gradient(#49384f,#181525);box-shadow:0 .5cqw 0 #181525,0 .6cqw 0 #887450}
#vhs-demo3 .vhs-boost-ring{position:absolute;bottom:14%;left:12%;width:76%;height:15%;border:1px solid var(--energy);border-radius:50%;box-shadow:0 0 .9cqw var(--energy),inset 0 0 .9cqw var(--energy);animation:vhs-boost-ring 2s ease-in-out infinite}
#vhs-demo3 .vhs-boost-plaque{width:100%;flex:0 0 6.5cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.35cqw .1cqw;background:linear-gradient(#3d304a,#211b30);border:1px solid #887450;border-radius:.35cqw;box-shadow:0 .4cqw 0 #181525;text-align:center}
#vhs-demo3 .vhs-boost-name{font:700 1.75cqw/1.12 Georgia,serif;color:#f5d49b;white-space:nowrap}
#vhs-demo3 .vhs-boost-owned{font:700 1.35cqw/1.12 Arial,sans-serif;color:#d5f3e4;margin-top:.55cqw}
#vhs-demo3 .vhs-boost-star{position:absolute;width:1.3cqw;height:1.9cqw;background:#fff;clip-path:polygon(50% 0,58% 40%,100% 50%,58% 60%,50% 100%,42% 60%,0 50%,42% 40%);filter:drop-shadow(0 0 .6cqw var(--energy));z-index:5;pointer-events:none;animation:vhs-boost-twinkle 2s ease-in-out infinite}
#vhs-demo3 .vhs-boost-star.one{left:17%;top:31%}
#vhs-demo3 .vhs-boost-star.two{right:13%;top:18%;animation-delay:.7s;width:.9cqw;height:1.3cqw}
#vhs-demo3 .vhs-boost-star.three{right:18%;bottom:28%;animation-delay:1.2s;width:.8cqw;height:1.2cqw}
#vhs-demo3 .vhs-boost-item:hover .vhs-boost-star,#vhs-demo3 .vhs-boost-item:focus-visible .vhs-boost-star{animation-duration:.7s;background:var(--energy)}
#vhs-demo3 .vhs-boost-item.vhs-boost-flash .vhs-boost-dome{animation:vhs-boost-flash .36s ease-out}
#vhs-demo3 .vhs-boost-effect{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#vhs-demo3 .vhs-boost-burst{position:absolute;width:24cqw;height:24cqw;transform:translate(-50%,-50%);overflow:visible;filter:drop-shadow(0 0 .6cqw var(--energy));animation:vhs-boost-burst .65s ease-out forwards}
#vhs-demo3 .vhs-boost-burst svg{width:100%;height:100%;overflow:visible}
#vhs-demo3 .vhs-boost-burst path{stroke-dasharray:180;animation:vhs-boost-draw .35s ease-out}
#vhs-demo3 .vhs-boost-overlay{position:absolute;inset:0;background:#181525d9;backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:20;padding:1.1cqw}
#vhs-demo3 .vhs-boost-card{position:relative;display:flex;flex-direction:column;align-items:center;width:42cqw;max-width:90%;height:100%;min-height:0;background:radial-gradient(ellipse at 50% 25%,#49384f,#211b30 70%);border:2px solid #f5d49b;border-radius:1cqw;padding:.8cqw 1.1cqw;text-align:center;box-shadow:0 0 0 .4cqw #181525,0 0 0 .5cqw #887450,0 1.2cqw 4cqw #000,0 0 3.4cqw color-mix(in srgb,var(--energy) 55%,transparent);overflow:hidden}
#vhs-demo3 .vhs-boost-card.vhs-boost-reveal{animation:vhs-boost-reveal .5s cubic-bezier(.2,.8,.2,1)}
#vhs-demo3 .vhs-boost-close{position:absolute;right:.6cqw;top:.6cqw;width:3.2cqw;height:3.2cqw;z-index:5;background:#211b30;border:1px solid #887450;color:#f5d49b;border-radius:50%;cursor:pointer;font-size:2.6cqw;line-height:1;padding:0}
#vhs-demo3 .vhs-boost-art{flex:1;min-height:0;width:100%;position:relative;overflow:hidden;isolation:isolate;border:1px solid #887450;border-radius:.6cqw;background:radial-gradient(ellipse,color-mix(in srgb,var(--energy) 45%,#211b30),#181525 75%);display:flex;justify-content:center;align-items:center}
#vhs-demo3 .vhs-boost-rays{position:absolute;inset:-80%;background:repeating-conic-gradient(from 0deg,transparent 0deg 19deg,color-mix(in srgb,var(--energy) 50%,transparent) 23deg,transparent 28deg 43deg);mask-image:radial-gradient(black,transparent 43%);animation:vhs-boost-spin 18s linear infinite}
#vhs-demo3 .vhs-boost-orbit{position:absolute;width:24%;aspect-ratio:1;border:1px solid var(--energy);border-radius:50%;box-shadow:0 0 1cqw var(--energy),inset 0 0 1cqw var(--energy);animation:vhs-boost-breath 1.5s infinite alternate}
#vhs-demo3 .vhs-boost-orbit:after{content:'';position:absolute;inset:-.8cqw;border:1px dashed var(--energy);border-radius:50%;animation:vhs-boost-spin 9s linear infinite}
#vhs-demo3 .vhs-boost-art .vhs-boost-symbol{width:50%;height:85%;font-size:8cqw;filter:drop-shadow(0 0 1.4cqw var(--energy))}
#vhs-demo3 .vhs-boost-sweep{position:absolute;inset:0;z-index:4;background:linear-gradient(115deg,transparent 35%,#ffffff75 48%,var(--energy) 50%,transparent 65%);transform:translateX(-130%);animation:vhs-boost-sweep 3s ease-in-out infinite;pointer-events:none}
#vhs-demo3 .vhs-boost-card .vhs-boost-owned{margin:.2cqw 0}
#vhs-demo3 .vhs-boost-desc{flex-shrink:0;width:100%;font:600 1.65cqw/1.22 Arial,sans-serif;color:#f2e9dd;border-top:1px solid #887450;margin:.45cqw 0;padding:.6cqw 0 .15cqw}
@keyframes vhs-boost-float{50%{transform:translateY(-.7cqw)}}
@keyframes vhs-boost-breath{to{transform:scale(1.1);opacity:1}}
@keyframes vhs-boost-ring{50%{transform:scaleX(.86);opacity:.55}}
@keyframes vhs-boost-twinkle{0%,100%{opacity:.1;transform:scale(.3) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(25deg)}}
@keyframes vhs-boost-flash{30%{filter:brightness(2);box-shadow:0 0 3.5cqw var(--energy),inset 0 0 2.4cqw white}100%{filter:brightness(1)}}
@keyframes vhs-boost-burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2) rotate(-15deg)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(12deg)}}
@keyframes vhs-boost-draw{from{stroke-dashoffset:180}to{stroke-dashoffset:0}}
@keyframes vhs-boost-reveal{0%{transform:perspective(600px) rotateY(-45deg) scale(.65);opacity:0;filter:brightness(2)}100%{transform:none;opacity:1;filter:brightness(1)}}
@keyframes vhs-boost-spin{to{transform:rotate(360deg)}}
@keyframes vhs-boost-sweep{0%,60%{transform:translateX(-130%)}90%,100%{transform:translateX(130%)}}
#vhs-demo3 .slots{padding:clamp(5px,.9cqw,9px);gap:clamp(4px,.8cqw,8px)}
#vhs-demo3 .vhs-boost-item{height:clamp(64px,10.7cqw,120px);min-width:0}
#vhs-demo3 .vhs-boost-item:focus-visible{outline:1px solid #ffe0a6;outline-offset:2px}
#vhs-demo3 .vhs-boost-item.selected .vhs-boost-dome{border-color:var(--energy);box-shadow:0 0 .7cqw var(--energy)}
#vhs-demo3 .vhs-boost-item .vhs-boost-symbol{font-size:clamp(17px,3.8cqw,38px)}
#vhs-demo3 .vhs-boost-plaque{flex:0 0 clamp(24px,3.4cqw,36px)}
#vhs-demo3 .vhs-boost-name{font-size:clamp(8px,1.15cqw,13px);white-space:normal;overflow-wrap:anywhere}
#vhs-demo3 .vhs-boost-owned{font-size:clamp(8px,1.05cqw,12px);margin-top:.15cqw}
#vhs-demo3 .vhs-boost-card{width:42cqw;max-width:90%}
#vhs-demo3 .vhs-boost-card .vhs-boost-owned{font-size:clamp(10px,1.5cqw,16px)}
#vhs-demo3 .vhs-boost-cardname{font-size:clamp(14px,2.65cqw,25px)}
#vhs-demo3 .vhs-boost-desc{font-size:clamp(10px,1.65cqw,16px);overflow-wrap:anywhere}
#vhs-demo3 .vhs-boost-close{width:clamp(22px,3.2cqw,32px);height:clamp(22px,3.2cqw,32px);font-size:clamp(16px,2.6cqw,26px)}
#vhs-demo3 .vhs-boost-overlay[hidden]{display:none}
@media(prefers-reduced-motion:reduce){#vhs-demo3 [class*="vhs-boost-"]{animation:none!important;transition:none!important}#vhs-demo3 .vhs-boost-effect{display:none}}
</style>
</head>
<body>
<main id="vhs-demo3">
<div class="shell">
<header class="head">
<div><div class="eyebrow">VHOUSE</div><h2>STUFF</h2></div>
</header>
<div class="area">
<section class="panel" aria-label="VCards">
<div class="panelhead">VCARDS</div>
<div class="stats" data-vcard-list tabindex="0" aria-label="Scrollable VCard list"></div>
</section>
<section class="panel" aria-label="Personal Inventory">
<div class="panelhead">PERSONAL INVENTORY</div>
<div class="inventory" tabindex="0" aria-label="Scrollable personal inventory">
<div class="slots" data-inventory></div>
</div>
<div class="details" aria-live="polite">
<strong data-name>Inventory</strong>
<p data-description>No items owned.</p>
</div>
</section>
</div>
</div>
<div class="vhs-boost-overlay" data-item-card hidden></div>
<div class="vhs-boost-effect" aria-hidden="true"></div>
</main>
<script src="assets/vhouse-public-config.js"></script>
<script src="assets/vhouse-auth.js"></script>
<script src="assets/vhouse-cards.js"></script>
<script src="assets/vhouse-stuff.js"></script>
<script>VHouseStuff.init(document.getElementById("vhs-demo3"));</script>
</body>
</html>
