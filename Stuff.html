<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHouse — Stuff</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0d101e}
#vhs-demo3{font-family:Arial,sans-serif;color:#f5e8d6;max-width:900px;margin:0 auto;padding:16px}
#vhs-demo3 *{box-sizing:border-box}
#vhs-demo3 button{font:inherit;cursor:pointer}
#vhs-demo3 .shell{border:2px solid #c29a62;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 40% 10%,#413149,#161525 75%)}
#vhs-demo3 .head{display:flex;align-items:center;justify-content:space-between;background:#151321df;border-bottom:1px solid #a08055;padding:12px 14px;gap:8px}
#vhs-demo3 .eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:#cba875}
#vhs-demo3 h2{font:700 clamp(22px,4vw,31px) Georgia,serif;color:#ffe2ac;margin:2px 0}
#vhs-demo3 .balances{display:flex;gap:7px}
#vhs-demo3 .balance{border:1px solid #92734d;background:#10111f;padding:7px 10px;border-radius:6px;text-align:center;min-width:67px}
#vhs-demo3 .balance small{display:block;color:#cbb592;font-size:10px;white-space:nowrap}
#vhs-demo3 .balance strong{display:block;color:#ffe0a1;font-size:16px;margin-top:3px}
#vhs-demo3 .area{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:10px;padding:12px}
#vhs-demo3 .panel{min-width:0;border:1px solid #857052;border-radius:7px;background:linear-gradient(145deg,#2e283c,#171725);overflow:hidden}
#vhs-demo3 .panelhead{padding:10px;background:#191728;border-bottom:1px solid #776042;font:700 clamp(13px,2.3vw,19px) Georgia,serif;color:#ffe0a6}
#vhs-demo3 .stats{padding:11px;display:flex;flex-direction:column;gap:8px}
#vhs-demo3 .vcard-name{border:1px solid #9b784b;border-radius:6px;padding:10px;background:#211c2f;text-align:center}
#vhs-demo3 .vcard-name small{display:block;color:#c7bad1;font-size:10px;margin-bottom:5px}
#vhs-demo3 .vcard-name strong{display:block;font-size:15px;color:#ffe0a6;overflow-wrap:anywhere}
#vhs-demo3 .statrow{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px solid #6c5a684f;font-size:12px}
#vhs-demo3 .statrow span{color:#d6cad6}
#vhs-demo3 .statrow strong{color:#ffdb9b;text-align:right}
#vhs-demo3 .inventory{height:242px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-y}
#vhs-demo3 .inventory::-webkit-scrollbar{display:none;width:0;height:0}
#vhs-demo3 .slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:9px}
#vhs-demo3 .slot{min-width:0;min-height:101px;padding:8px 3px;border:1px solid #6b5c73;border-radius:6px;background:linear-gradient(#302839,#191a29);color:#f4e8d9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;text-align:center}
#vhs-demo3 .slot:hover{border-color:#f6d291}
#vhs-demo3 .slot.selected{border:2px solid #ffdb93;background:linear-gradient(#4d394b,#242034)}
#vhs-demo3 .slot:focus-visible{outline:2px solid #ffe0a6;outline-offset:-2px}
#vhs-demo3 .itemicon{font-size:28px}
#vhs-demo3 .itemname{font-size:11px;line-height:1.2;font-weight:800}
#vhs-demo3 .qty{font-size:10px;color:#f8d49b}
#vhs-demo3 .details{margin:0 9px 9px;background:#171523;border:1px solid #79654e;border-radius:6px;padding:10px;min-height:65px}
#vhs-demo3 .details strong{font-size:13px;color:#ffe0a6}
#vhs-demo3 .details p{font-size:11px;line-height:1.4;color:#d7cbd8;margin:5px 0 0}
@media(max-width:460px){
#vhs-demo3{padding:6px}
#vhs-demo3 .head{padding:8px}
#vhs-demo3 .balance{padding:5px;min-width:57px}
#vhs-demo3 .balance strong{font-size:13px}
#vhs-demo3 .area{padding:7px;gap:6px}
#vhs-demo3 .panelhead{padding:8px 5px}
#vhs-demo3 .stats{padding:6px;gap:4px}
#vhs-demo3 .vcard-name{padding:7px 4px}
#vhs-demo3 .vcard-name strong{font-size:12px}
#vhs-demo3 .statrow{font-size:10px;padding:8px 0}
#vhs-demo3 .inventory{height:213px}
#vhs-demo3 .slots{gap:4px;padding:5px}
#vhs-demo3 .slot{min-height:86px;padding:5px 2px;gap:3px}
#vhs-demo3 .itemicon{font-size:22px}
#vhs-demo3 .itemname{font-size:9px}
#vhs-demo3 .details{margin:0 5px 5px;padding:6px}
}

/* Fit the same Stuff interface into the existing VHouse menu's content area. */
#vhs-demo3.embedded {
  width:100%; height:100%; max-width:none; padding:0; margin:0;
  overflow:hidden; container-type:inline-size;
}
#vhs-demo3.embedded .shell {
  width:100%; height:100%; display:flex; flex-direction:column;
  border:1px solid #bc9357; border-radius:.65cqw;
}
#vhs-demo3.embedded .head { flex:0 0 auto; padding:.45cqw .7cqw; }
#vhs-demo3.embedded .eyebrow { font-size:clamp(8px,1.15cqw,12px); letter-spacing:.14em; }
#vhs-demo3.embedded h2 { font-size:clamp(16px,2.7cqw,23px); margin:0; }
#vhs-demo3.embedded .balance { min-width:0; padding:.3cqw .6cqw; }
#vhs-demo3.embedded .balance small { font-size:clamp(8px,1.15cqw,11px); }
#vhs-demo3.embedded .balance strong { font-size:clamp(11px,1.7cqw,17px); margin-top:.15cqw; }
#vhs-demo3.embedded .area { flex:1; min-height:0; padding:.55cqw; gap:.55cqw; }
#vhs-demo3.embedded .panel { min-height:0; height:100%; display:flex; flex-direction:column; }
#vhs-demo3.embedded .panelhead { flex:0 0 auto; padding:.55cqw; font-size:clamp(10px,1.5cqw,15px); }
#vhs-demo3.embedded .stats { min-height:0; padding:.5cqw; gap:.3cqw; }
#vhs-demo3.embedded .vcard-name { padding:.45cqw; }
#vhs-demo3.embedded .vcard-name small { font-size:clamp(8px,1cqw,10px); margin-bottom:2px; }
#vhs-demo3.embedded .vcard-name strong { font-size:clamp(10px,1.5cqw,15px); }
#vhs-demo3.embedded .statrow { font-size:clamp(9px,1.2cqw,12px); padding:.3cqw 1px; }
#vhs-demo3.embedded .inventory { flex:1; min-height:0; height:auto; overflow-y:auto; }
#vhs-demo3.embedded .slots { gap:.45cqw; padding:.5cqw; }
#vhs-demo3.embedded .slot { min-height:clamp(50px,7.3cqw,75px); padding:.4cqw .2cqw; gap:.25cqw; }
#vhs-demo3.embedded .itemicon { font-size:clamp(16px,2.7cqw,25px); }
#vhs-demo3.embedded .itemname { font-size:clamp(9px,1.2cqw,12px); }
#vhs-demo3.embedded .qty { font-size:clamp(8px,1.1cqw,11px); }
#vhs-demo3.embedded .details { flex:0 0 auto; min-height:0; margin:0 .5cqw .5cqw; padding:.5cqw; }
#vhs-demo3.embedded .details strong { font-size:clamp(10px,1.3cqw,13px); }
#vhs-demo3.embedded .details p { font-size:clamp(9px,1.1cqw,11px); margin-top:.3cqw; line-height:1.2; }
</style>
</head>
<body>
<main id="vhs-demo3">
<div class="shell">
<header class="head">
<div><div class="eyebrow">VHOUSE</div><h2>STUFF</h2></div>
<div class="balances">
<div class="balance"><small>IG MONEY</small><strong>1,500</strong></div>
<div class="balance"><small>SCRAPS</small><strong>12</strong></div>
</div>
</header>
<div class="area">
<section class="panel" aria-label="VCard Stats">
<div class="panelhead">VCARD STATS</div>
<div class="stats">
<div class="vcard-name"><small>VCARD NAME</small><strong data-vcard-name>—</strong></div>
<div class="statrow"><span>VCards Owned</span><strong data-cards-owned>0</strong></div>
<div class="statrow"><span>Missions Completed</span><strong>2</strong></div>
<div class="statrow"><span>Journey Stage</span><strong>1</strong></div>
<div class="statrow"><span>Totem Pages</span><strong>0 / 5</strong></div>
<div class="statrow"><span>Z Book</span><strong>Not Assembled</strong></div>
</div>
</section>
<section class="panel" aria-label="Personal Inventory">
<div class="panelhead">PERSONAL INVENTORY</div>
<div class="inventory" tabindex="0" aria-label="Scrollable personal inventory">
<div class="slots" data-inventory></div>
</div>
<div class="details" aria-live="polite">
<strong data-name>Scrap Metal</strong>
<p data-description>Collected material from Journey Missions.</p>
</div>
</section>
</div>
</div>
</main>
<script src="assets/vhouse-cards.js"></script>
<script src="assets/vhouse-stuff.js"></script>
<script>VHouseStuff.init(document.getElementById("vhs-demo3"));</script>
</body>
</html>
