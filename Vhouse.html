<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHouse</title>
<link rel="stylesheet" href="assets/vhouse-buttons.css">
<script src="assets/vhouse-public-config.js"></script>
<script src="assets/vhouse-auth.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
/* Same portrait and game sizing rules as the town map. */
.rotate-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  color: #fff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 24px;
}
.rotate-icon { font-size: 64px; }
.rotate-screen h2 { font-size: 24px; }
.rotate-screen p { font-size: 16px; color: #bbb; }
@media (orientation: portrait) {
  .rotate-screen { display: flex; }
  .game-container { display: none !important; }
}
.game-container {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.map-container {
  position: relative;
  width: min(100vw, 200dvh);
  aspect-ratio: 2 / 1;
  flex-shrink: 0;
  container-type: inline-size;
}
.game-map {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
/* Hotspots align to the visible 16:9 VHome image inside the 2:1 game frame. */
.hotspot-layer {
  position: absolute;
  inset-block: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 88.888889%;
  pointer-events: none;
}
/* Moderate uneven yellow-and-white fireplace ambience. */
.fireplace-light {
  position: absolute;
  left: 40.5%;
  top: 55%;
  width: 19%;
  height: 23%;
  pointer-events: none;
  z-index: 0;
  mix-blend-mode: screen;
}
.fireplace-light::before,
.fireplace-light::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
}
.fireplace-light::before {
  background: radial-gradient(ellipse at 50% 64%,
    rgba(255, 255, 234, .65) 0%,
    rgba(255, 218, 99, .43) 25%,
    rgba(255, 166, 48, .18) 52%,
    transparent 78%);
  filter: blur(9px);
  animation: ember-breathe 4.7s ease-in-out infinite;
}
.fireplace-light::after {
  inset: 13% 22% 8%;
  background: radial-gradient(ellipse at 50% 65%,
    rgba(255, 255, 250, .68) 0%,
    rgba(255, 237, 169, .34) 34%,
    transparent 76%);
  filter: blur(7px);
  animation: ember-flicker 2.3s ease-in-out infinite;
}
@keyframes ember-breathe {
  0%, 100% { opacity: .65; transform: scale(.98, 1); }
  13% { opacity: .86; transform: scale(1.02, 1.05); }
  32% { opacity: .59; transform: scale(.97, 1.01); }
  53% { opacity: 1; transform: scale(1.05, 1.08); }
  69% { opacity: .69; transform: scale(.99, 1.03); }
  86% { opacity: .93; transform: scale(1.03, 1.07); }
}
@keyframes ember-flicker {
  0%, 100% { opacity: .70; transform: translateY(0) scale(1); }
  18% { opacity: 1; transform: translateY(-1%) scale(1.03, 1.06); }
  37% { opacity: .62; transform: translateY(1%) scale(.96, 1.01); }
  61% { opacity: 1; transform: translateY(-2%) scale(1.05, 1.08); }
  79% { opacity: .75; transform: translateY(0) scale(.99, 1.03); }
}
@media (prefers-reduced-motion: reduce) {
  .fireplace-light::before,
  .fireplace-light::after { animation: none; }
}
.hotspot-closet { left: 5.5%; top: 13.8%; width: 6.5%; height: 20.1%; }
.hotspot-billboard { left: 14%; top: 51.5%; width: 10.5%; height: 17.2%; }
.hotspot-travel { left: 88.7%; top: 15.4%; width: 7%; height: 22.1%; }
.hotspot-create { left: 44.6%; top: 58.1%; width: 10.7%; height: 20.1%; }
.hotspot-chest { left: 64.7%; top: 62.8%; width: 10.5%; height: 16.8%; }
.hotspot-chest::after { top: -30%; }
.hotspot-login { left: 6.5%; top: 70.7%; width: 15%; height: 28%; }
.hotspot-closet::after { left: 0; transform: translate(0, -50%); }
.hotspot-travel::after { left: auto; right: 0; transform: translate(0, -50%); }
/* Log In label stays on the lower-left table and shares the same idle effect. */
.hotspot-login::after {
  left: 50%;
  top: 34%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
}
/* House player badge keeps its original placement and shared portrait renderer. */
.hud-layer { position:absolute; inset:0; z-index:5; pointer-events:none; }
.hud-player-icon { top:0.2%; left:50%; transform:translateX(-50%); }
/* Reuse the same Vcontainer frame as the Journey menu. */
.login-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
}
.login-overlay[hidden] { display: none; }
.login-window {
  position: absolute;
  top: 9.14%;
  left: 50%;
  transform: translateX(-50%);
  width: 50.90%;
  height: 63.55%;
}
.login-window .login-frame {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
  border: 3px solid white;
  box-shadow: 0 0 10px rgba(255,255,255,.85);
  pointer-events: none;
}
/* Stuff uses the same existing frame position as the house's login menu. */
.stuff-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
}
.stuff-overlay[hidden] { display: none; }
.stuff-window {
  position: absolute;
  top: 19.5%;
  left: 50%;
  transform: translateX(-50%);
  width: 67.188%;
  height: 83.886%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stuff-window img {
  display: block;
  width: 100%;
  aspect-ratio: 1672 / 941;
  max-height: 100%;
  object-fit: fill;
  border: 3px solid white;
  box-shadow: 0 0 10px rgba(255, 255, 255, .85);
  pointer-events: none;
  user-select: none;
}
/* Align loaded Stuff content to the artwork, keeping the same menu position/size. */
.stuff-art { position:relative; width:100%; aspect-ratio:1672 / 941; max-height:100%; }
.stuff-art > img { height:100%; aspect-ratio:auto; max-height:none; }

/* Billboard is hosted inside this SAME VHouse game container. */
.billboard-overlay{
  position:absolute;
  inset:0;
  z-index:20;
  background:rgba(0,0,0,.45);
}
.billboard-overlay[hidden]{display:none}
.billboard-window{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:80%;
  height:84%;
  min-width:0;
  min-height:0;
}
.billboard-content{
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  container-type:inline-size;
}
/* All login text, spacing, and buttons scale with the game container. */
.login-options {
  position: absolute;
  inset: 18% 15%;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .85cqw;
}
.login-options h2 {
  color: #ffe9a4;
  font-size: 1.9cqw;
  font-weight: bold;
  line-height: 1.1;
  text-shadow: 0 0 .8cqw rgba(255, 210, 105, .65);
  letter-spacing: .06em;
}
.house-email-form{display:flex;gap:.3cqw;align-items:center;justify-content:center;width:100%}
.house-email-form[hidden]{display:none}
.house-email-form input{width:57%;min-width:0;background:#181226;color:white;border:1px solid #cfad6a;padding:.4cqw;font-size:1cqw}
.house-auth-status{font-size:1cqw;color:#f2e3c7;text-align:center;max-width:100%;overflow-wrap:anywhere}
.login-options [hidden]{display:none!important}
</style>
<link rel="stylesheet" href="assets/vhouse-layout.css">
<link rel="stylesheet" href="assets/vhouse-frame.css">
<link rel="stylesheet" href="assets/vhouse-player.css">
</head>
<body>
<div class="rotate-screen">
  <div class="rotate-icon">↻</div>
  <h2>Rotate Your Phone</h2>
  <p>Please turn your device sideways to play.</p>
</div>
<main class="game-container">
  <div class="map-container">
    <img class="game-map" src="assets/Vhome1.png" alt="VHouse Interior" draggable="false">
    <div class="hotspot-layer">
      <div class="fireplace-light" aria-hidden="true"></div>
      <a href="./VCloset.html" class="vhouse-btn house-hotspot hotspot-closet" data-label="VCard Closet" aria-label="VCard Closet"></a>
      <a href="./billboard.html" class="vhouse-btn house-hotspot hotspot-billboard" data-label="Billboard" aria-label="Billboard"></a>
      <a href="./index.html" class="vhouse-btn house-hotspot hotspot-travel" data-label="Go Outside" aria-label="Go Outside"></a>
      <a href="./VCardCreator.html" class="vhouse-btn house-hotspot hotspot-create" data-label="Create VCard" aria-label="Create VCard"></a>
      <button type="button" class="vhouse-btn house-hotspot hotspot-chest" data-label="Stuff" aria-label="Stuff"></button>
      <button type="button" class="vhouse-btn house-hotspot hotspot-login" data-label="Log In" aria-label="Log In"></button>
    </div>
    <div class="hud-layer">
      <div class="hud-player-icon" data-vhouse-player role="img" aria-label="Active VCard"></div>
    </div>
    <div id="loginOverlay" class="login-overlay" hidden>
      <div class="login-window" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <img class="login-frame" src="assets/Vcontainer.png" alt="" draggable="false">
        <div class="login-options">
          <h2 id="loginTitle">LOG IN</h2>
          <button type="button" id="houseEmailLogin" class="vhouse-btn">Log In with Email</button>
          <button type="button" id="houseDiscordLogin" class="vhouse-btn">Log In with Discord</button>
          <form id="houseEmailForm" class="house-email-form" hidden>
            <input id="houseEmailAddress" type="email" placeholder="Email address" autocomplete="email" required>
            <button type="submit" class="vhouse-btn">Send Email Link</button>
          </form>
          <p id="houseAuthStatus" class="house-auth-status" role="status">Checking account…</p>
          <button type="button" id="houseSignOut" class="vhouse-btn" hidden>Sign Out</button>
        </div>
      </div>
    </div>
    <div id="billboardOverlay" class="billboard-overlay" hidden>
      <div class="billboard-window" role="dialog" aria-modal="true" aria-label="VCard Billboard">
        <div id="billboardMenuContent" class="billboard-content"></div>
      </div>
    </div>
    <div id="stuffOverlay" class="stuff-overlay" hidden>
      <div class="stuff-window" role="dialog" aria-modal="true" aria-label="Stuff menu">
        <div class="stuff-art">
          <img src="assets/Vcontainer.png" alt="" draggable="false">
          <div id="stuffMenuContent" class="vhouse-frame-content"></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
const loginButton = document.querySelector(".hotspot-login");
const loginOverlay = document.getElementById("loginOverlay");
const loginWindow = loginOverlay.querySelector(".login-window");
const billboardButton = document.querySelector(".hotspot-billboard");
const billboardOverlay = document.getElementById("billboardOverlay");
const billboardMenuContent = document.getElementById("billboardMenuContent");
let billboardLoading = false;

// Measure against Overview only so changing tabs never changes the frame size.
function fitBillboard() {
  const menu = billboardMenuContent.shadowRoot?.getElementById("billboard");
  if (!menu || billboardOverlay.hidden) return;
  const availableWidth = billboardMenuContent.clientWidth;
  const availableHeight = billboardMenuContent.clientHeight;
  if (!availableWidth || !availableHeight) return;

  const overview = menu.querySelector("#overview");
  const activity = menu.querySelector("#activity");
  const overviewDisplay = overview.style.display;
  const activityDisplay = activity.style.display;

  // Measure the full Overview at its natural size, even when Activity is open.
  overview.style.display = "grid";
  activity.style.display = "none";
  menu.style.height = "auto";
  menu.style.setProperty("--billboard-scale", "1");
  const naturalWidth = menu.scrollWidth;
  const naturalHeight = menu.scrollHeight;
  menu.style.height = naturalHeight + "px";
  menu.style.setProperty("--billboard-scale", String(Math.min(1,
    (availableWidth - 2) / Math.max(1, naturalWidth),
    (availableHeight - 2) / Math.max(1, naturalHeight)
  )));

  overview.style.display = overviewDisplay;
  activity.style.display = activityDisplay;
}
new ResizeObserver(fitBillboard).observe(billboardMenuContent);

async function loadBillboard() {
  if (billboardLoading) return;
  if (billboardMenuContent.shadowRoot?.querySelector("#billboard")) {
    requestAnimationFrame(fitBillboard);
    return;
  }
  billboardLoading = true;
  try {
    const response = await fetch("./billboard.html", { cache: "no-store" });
    if (!response.ok) throw new Error("billboard.html returned " + response.status);
    const source = new DOMParser().parseFromString(await response.text(), "text/html");
    const template = source.getElementById("billboard");
    const css = source.querySelector("style")?.textContent;
    if (!template || !css) throw new Error("Billboard interface source is missing");

    // Keep the Billboard's styles separate from existing VHouse menus.
    const shadow = billboardMenuContent.shadowRoot ||
      billboardMenuContent.attachShadow({mode:"open"});
    const sheet = document.createElement("style");
    sheet.textContent = css + `
      :host{
        display:block;position:relative;
        width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;
      }
      #billboard{
        position:absolute;left:50%;top:50%;
        transform:translate(-50%,-50%) scale(var(--billboard-scale,1));
        transform-origin:center center;
        width:100%;height:auto;min-width:0;min-height:0;
        overflow:visible;
        font:11px/1.3 Consolas,"Courier New",monospace;
        color:#e1e9ed;
      }
      #billboard .cols,
      #billboard .activity{
        flex:0 0 auto;
        overflow:visible;
        min-height:0;
      }
    `;
    const menu = document.importNode(template, true);
    menu.querySelectorAll("[data-view]").forEach(tab => {
      tab.addEventListener("click", () => {
        const overview = tab.dataset.view === "overview";
        menu.querySelectorAll("[data-view]").forEach(item =>
          item.classList.toggle("active", item === tab));
        menu.querySelector("#overview").style.display = overview ? "grid" : "none";
        menu.querySelector("#activity").style.display = overview ? "none" : "block";
        // Keep the existing frame height and scale for both tabs.
      });
    });
    menu.querySelector(".billboard-back")?.addEventListener("click", event => {
      event.preventDefault();
      billboardOverlay.hidden = true;
    });
    shadow.replaceChildren(sheet, menu);
    requestAnimationFrame(fitBillboard);
  } catch(error) {
    console.error("VHouse Billboard:", error);
    const shadow = billboardMenuContent.shadowRoot ||
      billboardMenuContent.attachShadow({mode:"open"});
    const message = document.createElement("p");
    message.style.cssText = "padding:14px;background:#1b1320;color:#e5c38a;border:2px solid #bc9357;font:14px Arial,sans-serif";
    message.textContent = "Unable to load Billboard.";
    shadow.replaceChildren(message);
  } finally {
    billboardLoading = false;
  }
}
billboardButton.addEventListener("click", event => {
  event.preventDefault();
  billboardOverlay.hidden = false;
  void loadBillboard();
});
billboardOverlay.addEventListener("click", event => {
  if (event.target === billboardOverlay) billboardOverlay.hidden = true;
});

const stuffButton = document.querySelector(".hotspot-chest");
const stuffOverlay = document.getElementById("stuffOverlay");

const stuffMenuContent = document.getElementById("stuffMenuContent");
let stuffLoading = false;
async function loadStuff() {
  if (stuffLoading || stuffMenuContent.querySelector("#vhs-demo3")) return;
  stuffLoading = true;
  try {
    const response = await fetch("./Stuff.html", { cache: "no-store" });
    if (!response.ok) throw new Error("Stuff.html returned " + response.status);
    const source = new DOMParser().parseFromString(await response.text(), "text/html");
    const content = source.querySelector("#vhs-demo3");
    const css = source.querySelector("style")?.textContent || "";
    const scopedStart = css.indexOf("#vhs-demo3{");
    if (!content || scopedStart < 0) throw new Error("Stuff interface source is missing");
    let sheet = document.getElementById("stuffInterfaceStyles");
    if (!sheet) {
      sheet = document.createElement("style");
      sheet.id = "stuffInterfaceStyles";
      document.head.appendChild(sheet);
    }
    sheet.textContent = css.slice(scopedStart);
    const interfaceRoot = document.importNode(content, true);
    interfaceRoot.classList.add("embedded");
    stuffMenuContent.replaceChildren(interfaceRoot);
    VHouseStuff.init(interfaceRoot);
  } catch (error) {
    stuffMenuContent.textContent = "Unable to load Stuff.";
    console.error("VHouse Stuff:", error);
  } finally {
    stuffLoading = false;
  }
}
stuffButton.addEventListener("click", () => {
  stuffOverlay.hidden = false;
  loadStuff();
});
stuffOverlay.addEventListener("click", (event) => {
  if (event.target === stuffOverlay) stuffOverlay.hidden = true;
});

loginButton.addEventListener("click", () => {
  loginOverlay.hidden = false;
  updateHouseAccount();
});
function updateHouseAccount(){
  const auth=window.VHouseAuth;
  const user=auth?.getUser();
  document.getElementById("houseSignOut").hidden=!user;
  document.getElementById("houseDiscordLogin").textContent=user
    ? (user.identities?.some(i=>i.provider==="discord")?"Discord Connected":"Link Discord")
    : "Log In with Discord";
  document.getElementById("houseEmailLogin").textContent=user
    ? (user.email?"Email Connected / Update":"Link Email")
    : "Log In with Email";
  document.getElementById("houseAuthStatus").textContent=user
    ? "Signed in: "+(user.email||"Discord account")
    : "Sign in with Discord or Email.";
}
async function houseAuthAction(provider,options={}){
  const status=document.getElementById("houseAuthStatus");
  status.textContent="Connecting "+provider+"…";
  try{
    if(!window.VHouseAuth)throw Error("Authentication is not ready");
    await window.VHouseAuth.ready;
    const result=await window.VHouseAuth.signIn(provider,options);
    if(result?.authenticated)status.textContent="Account connected.";
    else status.textContent=result?.message||"Complete authentication to continue.";
    if(result?.authenticated)updateHouseAccount();
  }catch(error){status.textContent=error.message||"Authentication failed.";}
}
document.getElementById("houseDiscordLogin").addEventListener("click",()=>houseAuthAction("discord"));
document.getElementById("houseEmailLogin").addEventListener("click",()=>{
  const form=document.getElementById("houseEmailForm");
  form.hidden=!form.hidden;
  if(!form.hidden)document.getElementById("houseEmailAddress").focus();
});
document.getElementById("houseEmailForm").addEventListener("submit",event=>{
  event.preventDefault();
  void houseAuthAction("email",{email:document.getElementById("houseEmailAddress").value});
});
document.getElementById("houseSignOut").addEventListener("click",async()=>{
  try{
    await window.VHouseAuth.signOut();
    updateHouseAccount();
  }catch(error){document.getElementById("houseAuthStatus").textContent=error.message;}
});
window.addEventListener("load",()=>{
  window.VHouseAuth?.ready.then(updateHouseAccount).catch(error=>{
    document.getElementById("houseAuthStatus").textContent=error.message;
  });
});

loginOverlay.addEventListener("click", (event) => {
  if (!loginWindow.contains(event.target)) {
    loginOverlay.hidden = true;
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    loginOverlay.hidden = true;
    stuffOverlay.hidden = true;
    billboardOverlay.hidden = true;
  }
});
</script>
<script src="assets/vhouse-cards.js"></script>
<script src="assets/vhouse-stuff.js"></script>
<script src="assets/vhouse-player.js"></script>
</body>
</html>
