
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>VHouse Game Map</title>
<script>
// Show the tutorial before the game map on a player's first visit.
try {
  const enteredFromTutorial = new URLSearchParams(window.location.search).has("entered");
  if (!enteredFromTutorial && localStorage.getItem("vhouse_tutorial_seen") !== "yes") {
    window.location.replace("./tutorial.html");
  }
} catch (error) {
  // If storage is blocked, keep the map accessible.
}
</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

/* MOBILE ROTATION PROMPT */
.rotate-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  color: #fff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 24px;
}

.rotate-icon {
  font-size: 64px;
}

.rotate-screen h2 {
  font-size: 24px;
}

.rotate-screen p {
  font-size: 16px;
  color: #bbb;
}

@media (orientation: portrait) {
  .rotate-screen {
    display: flex;
  }

  .game-container {
    display: none !important;
  }
}

/* GAME CONTAINER */
.game-container {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* RESPONSIVE MAP */
.map-container {
  position: relative;
  width: min(100vw, 200dvh);
  aspect-ratio: 2 / 1;
  flex-shrink: 0;
}

.game-map {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* Small white sparkles continuously travel right and reset. */
.map-mist {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
  container-type: inline-size;
}
.mist-spark {
  position: absolute;
  top: var(--y);
  left: -8px;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: #fff;
  opacity: var(--brightness);
  box-shadow: 0 0 3px 1px rgba(255, 255, 255, .75);
  animation: sparkle-right var(--duration) linear infinite;
  animation-delay: var(--delay);
  will-change: transform;
}
@keyframes sparkle-right {
  from { transform: translateX(0); }
  to { transform: translateX(calc(100cqw + 16px)); }
}
@media (prefers-reduced-motion: reduce) {
  .mist-spark {
    animation: none;
    left: var(--rest-x);
  }
}

/* CLICKABLE MAP AREAS */
.map-hotspot {
  position: absolute;
  display: block;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* HOVER LABEL */
.map-hotspot::after {
  content: attr(data-label);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 10px 18px;
  background: rgba(0, 0, 0, 0.85);
  border: 2px solid #ffd54a;
  border-radius: 6px;
  color: #fff;
  font-size: clamp(12px, 1.5vw, 20px);
  font-weight: bold;
  white-space: nowrap;
  text-shadow: 0 0 8px #ffcc00;
  box-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.15s ease;
}

/* SHOW LABEL ON HOVER OR TAP */
.map-hotspot:hover::after,
.map-hotspot:focus::after {
  opacity: 1;
  visibility: visible;
}

/* LOCATION 1 - VHOUSE */
.hotspot-vhouse {
  left: 11.72%;
  top: 22.77%;
  width: 37.09%;
  height: 45.10%;
}

/* LOCATION 2 - JOURNEY */
.hotspot-journey {
  left: 56.14%;
  top: 46.45%;
  width: 9.81%;
  height: 26.61%;
}

/* LOCATION 3 - SHOP */
.hotspot-shop {
  left: 72.21%;
  top: 40.14%;
  width: 20.52%;
  height: 32.69%;
}

/* PLAYER ICON - UPPER LEFT OF JOURNEY OVERLAY */
.player-icon {
  position: absolute;
  top: 0.2%;
  left: 0.4%;
  width: 11%;
  aspect-ratio: 1 / 1;
  pointer-events: none;
}
.player-icon img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.player-icon::after {
  content: "";
  position: absolute;
  inset: 5%;
  border: 3px solid white;
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.85);
  pointer-events: none;
}

/* Journey overlay, aligned to the second marked rectangle. */
.journey-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
}
.journey-overlay[hidden] { display: none; }
.journey-window,
.message-window {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.journey-window {
  top: 9.14%;
  width: 50.90%;
  height: 63.55%;
}
.journey-window iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
}
.message-window {
  top: 74.72%;
  width: 55.99%;
  height: 22.81%;
}

</style>
<link rel="stylesheet" href="assets/vhouse-message.css">
</head>

<body>

<!-- ROTATE PHONE -->
<div class="rotate-screen">
  <div class="rotate-icon">↻</div>
  <h2>Rotate Your Phone</h2>
  <p>Please turn your device sideways to play.</p>
</div>

<!-- GAME MAP -->
<main class="game-container">

  <div class="map-container">

    <img
      src="assets/VCrad Town.png"
      class="game-map"
      alt="VCrad Town Game Map"
      draggable="false"
    >

    <!-- FLOATING WHITE SPARKLES -->
    <div class="map-mist" aria-hidden="true"></div>

    <!-- 1. VHOUSE -->
    <a
      href="./Vhouse.html"
      class="map-hotspot hotspot-vhouse"
      data-label="VHouse"
      aria-label="Enter VHouse">
    </a>

    <!-- 2. JOURNEY -->
    <button
      type="button"
      id="journeyButton"
      class="map-hotspot hotspot-journey"
      data-label="Journey"
      aria-label="Journey">
    </button>

    <!-- 3. SHOP -->
    <button
      type="button"
      class="map-hotspot hotspot-shop"
      data-label="Shop"
      aria-label="Shop">
    </button>

    <!-- JOURNEY OVERLAY -->
    <div id="journeyOverlay" class="journey-overlay" hidden>
      <div class="player-icon">
        <img src="assets/PlayerHolder-removebg-preview.png" alt="Player Icon" draggable="false">
      </div>
      <div class="journey-window">
        <iframe src="vcontainer.html" title="Journey Menu"></iframe>
      </div>
      <div class="message-window" data-vhouse-message data-header="JOURNEY" data-title="Journey" data-info="Select an option to begin."></div>
    </div>

  </div>

</main>

<script src="assets/vhouse-message.js"></script>
<script>
// Generate the white sparkles once; CSS handles all movement and resets.
const sparkleLayer = document.querySelector(".map-mist");
const sparkleFragment = document.createDocumentFragment();
let sparkleSeed = 1729;
function sparkleRandom() {
  sparkleSeed = (sparkleSeed * 1664525 + 1013904223) >>> 0;
  return sparkleSeed / 4294967296;
}
for (let i = 0; i < 52; i++) {
  const dot = document.createElement("span");
  dot.className = "mist-spark";
  const duration = 12 + sparkleRandom() * 13;
  dot.style.setProperty("--y", (4 + sparkleRandom() * 92).toFixed(1) + "%");
  dot.style.setProperty("--size", (2 + Math.floor(sparkleRandom() * 2)) + "px");
  dot.style.setProperty("--brightness", (0.82 + sparkleRandom() * 0.18).toFixed(2));
  dot.style.setProperty("--duration", duration.toFixed(1) + "s");
  dot.style.setProperty("--delay", (-sparkleRandom() * duration).toFixed(1) + "s");
  dot.style.setProperty("--rest-x", (sparkleRandom() * 96).toFixed(1) + "%");
  sparkleFragment.appendChild(dot);
}
sparkleLayer.appendChild(sparkleFragment);

const journeyButton = document.getElementById("journeyButton");
const journeyOverlay = document.getElementById("journeyOverlay");
const journeyWindow = journeyOverlay.querySelector(".journey-window");
const messageWindow = journeyOverlay.querySelector(".message-window");

journeyButton.addEventListener("click", () => {
  journeyOverlay.hidden = false;
});

journeyOverlay.addEventListener("click", (event) => {
  if (!journeyWindow.contains(event.target) &&
      !messageWindow.contains(event.target)) {
    journeyOverlay.hidden = true;
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    journeyOverlay.hidden = true;
  }
});
</script>
</body>
</html>
