
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VHouse Game Map</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.game-container {
  width: 100%;
  height: 100vh;
  height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  position: relative;
}

.map-container {
  position: relative;

  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.game-map {
  display: block;

  max-width: 100%;
  max-height: 100%;

  width: auto;
  height: auto;

  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

/* Mobile */
@media (max-width: 768px) {
  .game-container {
    width: 100vw;
    height: 100dvh;
  }

  .map-container {
    width: 100%;
    height: 100%;
  }

  .game-map {
    max-width: 100%;
    max-height: 100%;
  }
}
</style>
</head>

<body>

<main class="game-container">

  <div class="map-container">

    <img
      src="assets/VCrad Town.png"
      class="game-map"
      alt="VHouse Game Map"
      draggable="false"
    >

  </div>

</main>

</body>
</html>
