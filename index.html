
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>VHouse Game Map</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

/* MOBILE ROTATION PROMPT */
.rotate-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  color: #fff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 24px;
}

.rotate-icon {
  font-size: 64px;
}

.rotate-screen h2 {
  font-size: 24px;
}

.rotate-screen p {
  font-size: 16px;
  color: #bbb;
}

@media (orientation: portrait) and (pointer: coarse) {
  .rotate-screen {
    display: flex;
  }

  .game-container {
    display: none !important;
  }
}

/* GAME CONTAINER */
.game-container {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* RESPONSIVE MAP */
.map-container {
  position: relative;
  width: min(100vw, 200dvh);
  aspect-ratio: 2 / 1;
  flex-shrink: 0;
}

.game-map {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* Visible white twinkles drifting softly over the map. */
.map-mist {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}
.mist-spark {
  position: absolute;
  width: clamp(12px, 1.2vw, 20px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle,
    #fff 0 18%,
    rgba(255,255,255,.95) 19% 26%,
    rgba(255,255,255,.45) 36%,
    rgba(255,255,255,.13) 58%,
    transparent 78%);
  filter: drop-shadow(0 0 4px rgba(255,255,255,.9));
  opacity: .82;
  animation: mist-drift var(--pace, 20s) ease-in-out infinite alternate;
  animation-delay: var(--delay, 0s);
}
@keyframes mist-drift {
  0%   { transform: translate3d(-8px, 5px, 0); opacity: .72; }
  50%  { transform: translate3d(4px, -10px, 0); opacity: 1; }
  100% { transform: translate3d(12px, -18px, 0); opacity: .8; }
}
@media (prefers-reduced-motion: reduce) {
  .mist-spark { animation: none; opacity: .9; }
}

/* CLICKABLE MAP AREAS */
.map-hotspot {
  position: absolute;
  display: block;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* HOVER LABEL */
.map-hotspot::after {
  content: attr(data-label);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 10px 18px;
  background: rgba(0, 0, 0, 0.85);
  border: 1px solid #ffd54a;
  border-radius: 6px;
  color: #fff;
  font-size: clamp(12px, 1.5vw, 20px);
  font-weight: bold;
  white-space: nowrap;
  text-shadow: 0 0 8px #ffcc00;
  box-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.15s ease;
}

/* SHOW LABEL ON HOVER OR TAP */
.map-hotspot:hover::after,
.map-hotspot:focus::after {
  opacity: 1;
  visibility: visible;
}

/* LOCATION 1 - VHOUSE */
.hotspot-vhouse {
  left: 11.72%;
  top: 22.77%;
  width: 37.09%;
  height: 45.10%;
}

/* LOCATION 2 - JOURNEY */
.hotspot-journey {
  left: 56.14%;
  top: 46.45%;
  width: 9.81%;
  height: 26.61%;
}

/* LOCATION 3 - SHOP */
.hotspot-shop {
  left: 72.21%;
  top: 40.14%;
  width: 20.52%;
  height: 32.69%;
}

/* PLAYER ICON - UPPER LEFT OF JOURNEY OVERLAY */
.player-icon {
  position: absolute;
  top: 0.2%;
  left: 0.4%;
  width: 11%;
  aspect-ratio: 1 / 1;
  pointer-events: none;
}
.player-icon img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.player-icon::after {
  content: "";
  position: absolute;
  inset: 5%;
  border: 3px solid white;
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.85);
  pointer-events: none;
}

/* Journey overlay, aligned to the second marked rectangle. */
.journey-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
}
.journey-overlay[hidden] { display: none; }
.journey-window,
.message-window {
  position: absolute;
  left: 50%;
  width: 50.90%;
  transform: translateX(-50%);
}
.journey-window {
  top: 9.14%;
  height: 63.55%;
}
/* MESSAGE CONTAINER */
.message-window {
  top: 75.76%;
  height: 20.74%;
}
.journey-window iframe,
.message-window iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
}

</style>
</head>

<body>

<!-- ROTATE PHONE -->
<div class="rotate-screen">
  <div class="rotate-icon">↻</div>
  <h2>Rotate Your Phone</h2>
  <p>Please turn your device sideways to play.</p>
</div>

<!-- GAME MAP -->
<main class="game-container">

  <div class="map-container">

    <img
      src="assets/VCrad Town.png"
      class="game-map"
      alt="VCrad Town Game Map"
      draggable="false"
    >

    <!-- QUIET AMBIENT TWINKLES -->
    <div class="map-mist" aria-hidden="true">
      <span class="mist-spark" style="left:7%;top:28%;--pace:22s;--delay:-9s"></span>
      <span class="mist-spark" style="left:19%;top:15%;--pace:24s;--delay:-16s"></span>
      <span class="mist-spark" style="left:35%;top:34%;--pace:19s;--delay:-4s"></span>
      <span class="mist-spark" style="left:48%;top:19%;--pace:26s;--delay:-13s"></span>
      <span class="mist-spark" style="left:59%;top:32%;--pace:23s;--delay:-7s"></span>
      <span class="mist-spark" style="left:79%;top:19%;--pace:27s;--delay:-19s"></span>
      <span class="mist-spark" style="left:92%;top:43%;--pace:21s;--delay:-11s"></span>
      <span class="mist-spark" style="left:14%;top:74%;--pace:25s;--delay:-5s"></span>
      <span class="mist-spark" style="left:42%;top:81%;--pace:22s;--delay:-17s"></span>
      <span class="mist-spark" style="left:72%;top:77%;--pace:28s;--delay:-15s"></span>
    </div>

    <!-- 1. VHOUSE -->
    <button
      type="button"
      class="map-hotspot hotspot-vhouse"
      data-label="VHouse"
      aria-label="VHouse">
    </button>

    <!-- 2. JOURNEY -->
    <button
      type="button"
      id="journeyButton"
      class="map-hotspot hotspot-journey"
      data-label="Journey"
      aria-label="Journey">
    </button>

    <!-- 3. SHOP -->
    <button
      type="button"
      class="map-hotspot hotspot-shop"
      data-label="Shop"
      aria-label="Shop">
    </button>

    <!-- JOURNEY OVERLAY -->
    <div id="journeyOverlay" class="journey-overlay" hidden>
      <div class="player-icon">
        <img src="assets/PlayerHolder-removebg-preview.png" alt="Player Icon" draggable="false">
      </div>
      <div class="journey-window">
        <iframe src="vcontainer.html" title="Journey Menu"></iframe>
      </div>
      <div class="message-window">
        <iframe src="vcontainer.html?mode=message" title="Journey Messages"></iframe>
      </div>
    </div>

  </div>

</main>

<script>
const journeyButton = document.getElementById("journeyButton");
const journeyOverlay = document.getElementById("journeyOverlay");
const journeyWindow = journeyOverlay.querySelector(".journey-window");
const messageWindow = journeyOverlay.querySelector(".message-window");

journeyButton.addEventListener("click", () => {
  journeyOverlay.hidden = false;
});

journeyOverlay.addEventListener("click", (event) => {
  if (!journeyWindow.contains(event.target) &&
      !messageWindow.contains(event.target)) {
    journeyOverlay.hidden = true;
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    journeyOverlay.hidden = true;
  }
});
</script>
</body>
</html>
