
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>VHouse Game Map</title>
<script>
// First external entry goes through Draft 2 startup. Internal game navigation stays intact.
try {
  const params = new URLSearchParams(window.location.search);
  const returningFromTutorial = params.has("entered");
  const comingFromTitle = params.has("started");
  const started = sessionStorage.getItem("vhouse_startup_ready_v1") === "yes";
  if (returningFromTutorial || comingFromTitle) {
    sessionStorage.setItem("vhouse_startup_ready_v1", "yes");
  } else if (!started) {
    window.location.replace("./startup.html");
  }
} catch (error) {
  // If browser storage is unavailable, the existing Town remains accessible.
  console.warn("VHouse entry check could not access session storage:", error);
}
</script>

<link rel="stylesheet" href="assets/vhouse-buttons.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

/* MOBILE ROTATION PROMPT */
.rotate-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  color: #fff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 24px;
}

.rotate-icon {
  font-size: 64px;
}

.rotate-screen h2 {
  font-size: 24px;
}

.rotate-screen p {
  font-size: 16px;
  color: #bbb;
}

@media (orientation: portrait) {
  .rotate-screen {
    display: flex;
  }

  .game-container {
    display: none !important;
  }
}

/* GAME CONTAINER */
.game-container {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* RESPONSIVE MAP */
.map-container {
  position: relative;
  width: min(100vw, 200dvh);
  aspect-ratio: 2 / 1;
  flex-shrink: 0;
}

.game-map {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* Small white sparkles continuously travel right and reset. */
.map-mist {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
  container-type: inline-size;
}
.mist-spark {
  position: absolute;
  top: var(--y);
  left: -8px;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: #fff;
  opacity: var(--brightness);
  box-shadow: 0 0 3px 1px rgba(255, 255, 255, .75);
  animation: sparkle-right var(--duration) linear infinite;
  animation-delay: var(--delay);
  will-change: transform;
}
@keyframes sparkle-right {
  from { transform: translateX(0); }
  to { transform: translateX(calc(100cqw + 16px)); }
}
@media (prefers-reduced-motion: reduce) {
  .mist-spark {
    animation: none;
    left: var(--rest-x);
  }
}

/* LOCATION 1 - VHOUSE */
.hotspot-vhouse {
  left: 11.72%;
  top: 22.77%;
  width: 37.09%;
  height: 45.10%;
}

/* LOCATION 2 - JOURNEY */
.hotspot-journey {
  left: 56.14%;
  top: 46.45%;
  width: 9.81%;
  height: 26.61%;
}

/* LOCATION 3 - SHOP */
.hotspot-shop {
  left: 72.21%;
  top: 40.14%;
  width: 20.52%;
  height: 32.69%;
}

/* Page placement; the icon and info box are a persistent UI object. */
.town-player-hud { top: 1%; left: 1%; }
/* Journey overlay, aligned to the second marked rectangle. */
.journey-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
}
.journey-overlay[hidden] { display: none; }
.journey-window {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.journey-window {
  top: 0%;
  width: 67.75%;
  height: 84.59%;
}
.journey-window .vhouse-frame-art { width:100%; height:100%; }
/* Enlarge the COMPLETE Receipt Game panel 30% within the existing artwork.
   Change only the Journey content box, not the decorative VHouse frame. */
.journey-window #journeyContent {
  left: 2.29%;
  top: 17.96%;
  width: 95.42%;
  height: 69.68%;
}

</style>
<link rel="stylesheet" href="assets/vhouse-layout.css">
<link rel="stylesheet" href="assets/vhouse-frame.css">

<body>

<!-- ROTATE PHONE -->
<div class="rotate-screen">
  <div class="rotate-icon">↻</div>
  <h2>Rotate Your Phone</h2>
  <p>Please turn your device sideways to play.</p>
</div>

<!-- GAME MAP -->
<main class="game-container">

  <div class="map-container">

    <img
      src="assets/VCrad Town.png"
      class="game-map"
      alt="VCrad Town Game Map"
      draggable="false"
    >

    <!-- FLOATING WHITE SPARKLES -->
    <div class="map-mist" aria-hidden="true"></div>

    <!-- 1. VHOUSE -->
    <a
      href="./Vhouse.html"
      class="vhouse-btn map-hotspot hotspot-vhouse"
      data-label="VHouse"
      aria-label="Enter VHouse">
    </a>

    <!-- 2. JOURNEY -->
    <button
      type="button"
      id="journeyButton"
      class="vhouse-btn map-hotspot hotspot-journey"
      data-label="Journey"
      aria-label="Journey">
    </button>

    <!-- 3. SHOP -->
    <a
      href="./Vshop.html"
      class="vhouse-btn map-hotspot hotspot-shop"
      data-label="Shop"
      aria-label="Enter Shop">
    </a>

    <!-- Persistent player icon and reusable information box -->
    <aside class="vhouse-player-hud town-player-hud" aria-label="Player information">
      <div data-vhouse-player role="img" aria-label="Active VCard"></div>
      <div data-vhouse-info aria-live="polite"></div>
    </aside>

    <!-- Journey displays only the menu -->
    <div id="journeyOverlay" class="journey-overlay" hidden>
      <div class="journey-window">
        <img class="vhouse-frame-art" src="assets/Vcontainer.png" alt="" draggable="false">
        <div class="vhouse-frame-content" id="journeyContent"></div>
      </div>
    </div>

  </div>

</main>

<script>
// Generate the white sparkles once; CSS handles all movement and resets.
const sparkleLayer = document.querySelector(".map-mist");
const sparkleFragment = document.createDocumentFragment();
let sparkleSeed = 1729;
function sparkleRandom() {
  sparkleSeed = (sparkleSeed * 1664525 + 1013904223) >>> 0;
  return sparkleSeed / 4294967296;
}
for (let i = 0; i < 52; i++) {
  const dot = document.createElement("span");
  dot.className = "mist-spark";
  const duration = 12 + sparkleRandom() * 13;
  dot.style.setProperty("--y", (4 + sparkleRandom() * 92).toFixed(1) + "%");
  dot.style.setProperty("--size", (2 + Math.floor(sparkleRandom() * 2)) + "px");
  dot.style.setProperty("--brightness", (0.82 + sparkleRandom() * 0.18).toFixed(2));
  dot.style.setProperty("--duration", duration.toFixed(1) + "s");
  dot.style.setProperty("--delay", (-sparkleRandom() * duration).toFixed(1) + "s");
  dot.style.setProperty("--rest-x", (sparkleRandom() * 96).toFixed(1) + "%");
  sparkleFragment.appendChild(dot);
}
sparkleLayer.appendChild(sparkleFragment);

const journeyButton = document.getElementById("journeyButton");
const journeyOverlay = document.getElementById("journeyOverlay");
const journeyWindow = journeyOverlay.querySelector(".journey-window");

journeyButton.addEventListener("click", () => {
  journeyOverlay.hidden = false;
  // Keep one Journey instance alive when the menu is closed and reopened.
  void VHouseJourney.load(document.getElementById("journeyContent"), {embedded:true});
});
/* Placeholder's Journey action opens the existing Town Journey box. */
if (new URLSearchParams(location.search).get("journey")==="1") {
  window.addEventListener("load",()=>journeyButton.click(),{once:true});
}

journeyOverlay.addEventListener("click", (event) => {
  if (!journeyWindow.contains(event.target)) {
    journeyOverlay.hidden = true;
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    journeyOverlay.hidden = true;
  }
});
</script>
