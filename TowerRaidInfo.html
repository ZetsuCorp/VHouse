<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHouse — Tower Raid Info</title>
<link rel="stylesheet" href="assets/vhouse-layout.css">
<link rel="stylesheet" href="assets/vhouse-buttons.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial,sans-serif; }
.game-container { width:100vw; height:100dvh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.map-container { position:relative; width:min(100vw, 200dvh); aspect-ratio:2/1; flex-shrink:0; background:#120d20; border:2px solid #bc9357; }
.info-image { width:100%; height:100%; object-fit:contain; display:block; }
.raid-back-button { position:absolute; left:3%; bottom:5%; z-index:2; }
.continue-button { position:absolute; left:50%; bottom:5%; transform:translateX(-50%); padding:.6% 1.3%; background:#160d27; color:white; border:2px solid #ffb62d; border-radius:6px; font-weight:900; font-size:clamp(11px,1.1vw,17px); cursor:pointer; box-shadow:0 0 12px #ff9d2966; z-index:2; }
.continue-button:hover { background:rgba(54,32,78,.72); box-shadow:0 0 18px #ffb62d99; }
/* Semi-transparent navigation buttons preserve visibility of the background art. */
.raid-back-button,
.continue-button { background:rgba(22,13,39,.58); }
.raid-back-button:hover,
.raid-back-button:focus-visible { background:rgba(54,32,78,.72); }

/* Index map's drifting white sparkles. */
.map-mist {
  position:absolute; inset:0; overflow:hidden; pointer-events:none;
  z-index:1; container-type:inline-size;
}
.mist-spark {
  position:absolute; top:var(--y); left:-8px;
  width:var(--size); height:var(--size); border-radius:50%;
  background:#fff; opacity:var(--brightness);
  box-shadow:0 0 3px 1px rgba(255,255,255,.75);
  animation:sparkle-right var(--duration) linear infinite;
  animation-delay:var(--delay);
  will-change:transform;
}
@keyframes sparkle-right {
  from { transform:translateX(0); }
  to { transform:translateX(calc(100cqw + 16px)); }
}
/* Glow isolated over the illustrated RAID EGG; does not affect the text or buttons. */
.raid-egg-effect {
  position:absolute; z-index:1; pointer-events:none;
  left:68.3%; top:17%; width:18.3%; height:39%;
  border-radius:48% 48% 43% 43% / 56% 56% 42% 42%;
  transform:rotate(-8deg);
  border:2px solid rgba(255,203,89,.25);
  box-shadow:0 0 .8cqw rgba(255,200,90,.35), inset 0 0 .6cqw rgba(255,179,75,.18);
  animation:egg-border-pulse 3.4s ease-in-out infinite;
}
.raid-egg-effect::before {
  content:""; position:absolute; inset:-9%; border-radius:inherit;
  background:radial-gradient(ellipse at 52% 57%,rgba(255,245,190,.58) 0%,rgba(255,187,65,.28) 31%,rgba(244,100,255,.12) 62%,transparent 80%);
  mix-blend-mode:screen;
  opacity:0;
  animation:egg-flash 4.3s ease-in-out infinite;
}
@keyframes egg-border-pulse {
  0%,100% { border-color:rgba(255,203,89,.18); box-shadow:0 0 .5cqw rgba(255,200,90,.22), inset 0 0 .5cqw rgba(255,179,75,.1); }
  50% { border-color:rgba(255,237,161,.8); box-shadow:0 0 1.4cqw rgba(255,203,94,.8),0 0 2.6cqw rgba(208,78,255,.45),inset 0 0 .8cqw rgba(255,218,127,.28); }
}
@keyframes egg-flash {
  0%,56%,76%,100% { opacity:0; }
  61% { opacity:.72; }
  65% { opacity:.08; }
  69% { opacity:.9; }
}
@media (prefers-reduced-motion:reduce) {
  .mist-spark { animation:none; left:var(--rest-x); }
  .raid-egg-effect,.raid-egg-effect::before { animation:none; }
  .raid-egg-effect { border-color:rgba(255,217,131,.55); }
}
</style>
</head>
<body>
<main class="game-container">
  <div class="map-container">
    <img class="info-image" src="assets/TOWERBOSS.png" alt="Tower Boss Raid information and maximum rewards" draggable="false">
    <div class="map-mist" aria-hidden="true"></div>
    <div class="raid-egg-effect" aria-hidden="true"></div>
    <a class="back-button raid-back-button" href="./index.html">BACK</a>
    <button class="continue-button" type="button" onclick="window.location.href='./RaidBoss.html'">CONTINUE</button>
  </div>
</main>

<script>
// Match the Index's seeded sparkle field without any extra animation timers.
const sparkleLayer = document.querySelector(".map-mist");
const sparkleFragment = document.createDocumentFragment();
let sparkleSeed = 1729;
function sparkleRandom() {
  sparkleSeed = (sparkleSeed * 1664525 + 1013904223) >>> 0;
  return sparkleSeed / 4294967296;
}
for (let i = 0; i < 52; i++) {
  const dot = document.createElement("span");
  dot.className = "mist-spark";
  const duration = 12 + sparkleRandom() * 13;
  dot.style.setProperty("--y", (4 + sparkleRandom() * 92).toFixed(1) + "%");
  dot.style.setProperty("--size", (2 + Math.floor(sparkleRandom() * 2)) + "px");
  dot.style.setProperty("--brightness", (0.82 + sparkleRandom() * 0.18).toFixed(2));
  dot.style.setProperty("--duration", duration.toFixed(1) + "s");
  dot.style.setProperty("--delay", (-sparkleRandom() * duration).toFixed(1) + "s");
  dot.style.setProperty("--rest-x", (sparkleRandom() * 96).toFixed(1) + "%");
  sparkleFragment.appendChild(dot);
}
sparkleLayer.appendChild(sparkleFragment);
</script>
</body>
</html>
