<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VHouse Journey Missions</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;color:#fff}
.journey-frame{position:relative;width:100%;height:100%;container-type:inline-size;overflow:hidden}
.frame-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
.menu{position:absolute;left:50%;transform:translateX(-50%);width:63%;top:17%;height:66%;display:flex;flex-direction:column;align-items:center;gap:2%;min-height:0}
h1{font-size:clamp(11px,2.9cqw,27px);color:#ffe4a5;margin:0;line-height:1.1;letter-spacing:.08em;text-shadow:0 2px 7px #000}
.hint{font-size:clamp(8px,1.65cqw,15px);margin:0;text-align:center;color:#d9e6f2}
.cards{display:flex;align-items:stretch;justify-content:center;gap:3%;width:100%;flex:1;min-height:0;padding:0}
.card{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5%;border:2px solid var(--edge);border-radius:8px;color:#fff;background:linear-gradient(155deg,var(--light),var(--dark));box-shadow:inset 0 0 0 3px #ffffff17,0 5px 12px #0008;cursor:pointer;transition:filter .15s,transform .15s}
.card:hover,.card:focus-visible{filter:brightness(1.25);transform:translateY(-2px)}
.card:active{transform:scale(.97)}
.card.r{--light:#e94d59;--dark:#711321;--edge:#ffc4c8}
.card.p{--light:#318fff;--dark:#102c85;--edge:#b9e7ff}
.card.s{--light:#39c872;--dark:#0e6136;--edge:#c6ffd8}
.glyph{width:min(9cqw,58px);aspect-ratio:1;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-family:Georgia,serif;font-weight:bold;font-size:clamp(20px,5.3cqw,52px);background:#0004;box-shadow:0 0 15px #0005}
.name{font-size:clamp(8px,1.85cqw,18px);font-weight:bold;letter-spacing:.13em}
.stage-card{--selected:#d8b57b;width:100%;flex:1;min-height:0;display:none;flex-direction:column;gap:5%;border:2px solid var(--selected);background:linear-gradient(145deg,#23445b,#101a2d);border-radius:8px;padding:3%;box-shadow:inset 0 0 0 3px #ffffff13}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:clamp(9px,1.85cqw,18px);font-weight:bold;color:#ffe4a5}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));flex:1;min-height:0;gap:2%}
.stage{cursor:pointer;background:#17354b;border:1px solid #7398b0;border-radius:5px;color:#fff;font-size:clamp(9px,2.2cqw,21px);font-weight:bold}
.stage:hover,.stage:focus-visible,.stage.active{background:#435f4b;border-color:var(--selected);box-shadow:0 0 8px var(--selected)}
.details{min-height:10%;font-size:clamp(8px,1.4cqw,14px);color:#d9e6f2;text-align:center}
.footer{width:100%;display:flex;justify-content:space-between;align-items:center;gap:5px}
.back,.launch{border:1px solid #b9a173;border-radius:4px;padding:1.2% 3%;font-size:clamp(8px,1.4cqw,14px);font-weight:bold;cursor:pointer;color:#ffe8bb;background:#443a26}
.launch:disabled{opacity:.45;cursor:default}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="journey-frame">
<img class="frame-art" src="assets/Vcontainer.png" alt="">
<section class="menu" aria-label="Journey missions">
<h1>JOURNEY MISSIONS</h1>
<p class="hint" id="hint">Choose your VCard</p>
<div class="cards" id="cards">
<button class="card r" data-letter="R"><span class="glyph">R</span><span class="name">ROCK</span></button>
<button class="card p" data-letter="P"><span class="glyph">P</span><span class="name">PAPER</span></button>
<button class="card s" data-letter="S"><span class="glyph">S</span><span class="name">SCISSORS</span></button>
</div>
<div class="stage-card" id="stageCard">
<div class="stage-head"><span id="chosenCard">R VCARD</span><span>STAGES 1–10</span></div>
<div class="stages" id="stages"></div>
<div class="details" id="details">Select a mission stage</div>
<div class="footer"><button class="back" id="back">← BACK</button><button class="launch" id="launch" disabled>START JOURNEY</button></div>
</div>
</section>
</main>
<script>
const cards=document.getElementById('cards'),stageCard=document.getElementById('stageCard');
const stages=document.getElementById('stages'),details=document.getElementById('details'),launch=document.getElementById('launch');
let selectedLetter=null,selectedStage=null;
const known={1:'30 seconds · 3 hunts · 300 IG',2:'60 seconds · 4 hunts + 2 fights · 500 IG'};
stages.innerHTML=Array.from({length:10},(_,i)=>'<button class="stage" data-stage="'+(i+1)+'" aria-label="Stage '+(i+1)+'">'+(i+1)+'</button>').join('');
cards.addEventListener('click',event=>{
 const card=event.target.closest('[data-letter]');if(!card)return;
 selectedLetter=card.dataset.letter;selectedStage=null;
 document.getElementById('chosenCard').textContent=selectedLetter+' VCARD';
 stageCard.style.setProperty('--selected',({R:'#ffc4c8',P:'#b9e7ff',S:'#c6ffd8'})[selectedLetter]);
 document.getElementById('hint').textContent='Select a mission stage';
 cards.hidden=true;stageCard.style.display='flex';launch.disabled=true;details.textContent='Select a mission stage';
 stages.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
});
stages.addEventListener('click',event=>{
 const btn=event.target.closest('[data-stage]');if(!btn)return;
 selectedStage=Number(btn.dataset.stage);
 stages.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===btn));
 details.textContent='Stage '+selectedStage+' · '+(known[selectedStage]||'Mission details coming soon');
 launch.disabled=!known[selectedStage];
});
document.getElementById('back').addEventListener('click',()=>{
 selectedLetter=null;selectedStage=null;cards.hidden=false;stageCard.style.display='none';
 document.getElementById('hint').textContent='Choose your VCard';
});
launch.addEventListener('click',()=>{
 if(!known[selectedStage])return;
 details.textContent='Stage '+selectedStage+' selected. Mission execution is not connected yet.';
});
</script>
</body>
</html>
