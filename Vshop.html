}

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
.rotate-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  color: #fff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 24px;
}
.rotate-icon { font-size: 64px; }
.rotate-screen h2 { font-size: 24px; }
.rotate-screen p { font-size: 16px; color: #bbb; }
@media (orientation: portrait) {
  .rotate-screen { display: flex; }
  .game-container { display: none !important; }
}
.game-container {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.map-container {
  position: relative;
  width: min(100vw, 200dvh);
  aspect-ratio: 2 / 1;
  flex-shrink: 0;
}
.game-map {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
/* The artwork is 16:9 inside the shared 2:1 game frame. */
.shop-hotspot-layer {
  position: absolute;
  inset-block: 0;
  left: 50%;
  width: 88.888889%;
  transform: translateX(-50%);
  pointer-events: none;
}
.shop-hotspot {
  pointer-events: auto;
}
/* The three marked areas, left to right, on the shop artwork. */
.hotspot-mission-boosts { left: 4.4%; top: 34%; width: 20.2%; height: 28.5%; }
/* Keep the Mission Boosts hover label below the player HUD. */
.hotspot-mission-boosts::after { top: 85%; }
.hotspot-journey-service { left: 26.4%; top: 49%; width: 46.4%; height: 15.5%; }
.hotspot-trade-scraps { left: 81.8%; top: 64.7%; width: 18%; height: 35%; }

/* All Shop menus share this frame, lowered beneath the Player Placeholder HUD. */
.shop-menu-overlay{position:absolute;inset:0;z-index:40}
.shop-menu-window{
  position:absolute;top:17.5%;left:50%;width:55.99%;height:69.91%;
  transform:translateX(-50%);container-type:inline-size;
}
.shop-menu-frame{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  object-fit:fill;border:3px solid white;
  box-shadow:0 0 10px rgba(255,255,255,.85);
  pointer-events:none;user-select:none;
}
/* Direct DOM content; no iframe or page scaling. */
/* Enlarge each Shop menu's content panel by 25%, centered inside its existing frame. */
.shop-menu-window .shop-menu-content{
  position:absolute;left:4.125%;top:19.3%;width:91.75%;height:67%;
  overflow:hidden;min-width:0;min-height:0;
}
.zshop{font-family:Arial,sans-serif;color:#f7ead4;width:100%;height:100%;
  display:flex;flex-direction:column;border:1px solid #bc9357;border-radius:.65cqw;
  background:linear-gradient(135deg,#292135,#141423);overflow:hidden}
.zshop *{box-sizing:border-box}
.zshop button{font-family:Arial,sans-serif;cursor:pointer}
.zshop button:focus-visible{outline:2px solid #ffe0a3;outline-offset:-2px}
.zshop-title{flex:0 0 auto;font:700 clamp(18px,2.7cqw,31px)/1.07 Georgia,serif;color:#ffe2ab;white-space:nowrap;padding:.4cqw .7cqw}
.zshop-work{flex:1;display:grid;grid-template-columns:minmax(0,1.52fr) minmax(0,1fr);
  min-width:0;min-height:0;gap:.8cqw;padding:.65cqw}
.zshop-work.trade-layout{grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:.25cqw}
.zshop-panel{display:flex;flex-direction:column;min-height:0;min-width:0;
  border:1px solid #776149;border-radius:.55cqw;background:#1d192c;overflow:hidden}
.zshop-panel-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:.5cqw;min-height:2.8cqw;padding:.38cqw .7cqw;background:#181525;border-bottom:1px solid #645440}
.zshop-panel-head strong{font:700 clamp(13px,1.9cqw,20px)/1 Georgia,serif;color:#ffdda5}
.zshop-panel-head small{font:700 clamp(10px,1.3cqw,14px)/1 Arial,sans-serif;color:#e0cbbb}
.zshop-grid{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));min-height:0;min-width:0;
  gap:.45cqw;padding:.55cqw;align-content:stretch}
.zshop-grid.service-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.zshop-grid.boost-grid{grid-template-rows:repeat(3,minmax(0,1fr))}
.zshop-item{min-height:0;min-width:0;display:flex;flex-direction:column;

.zshop-item:hover{border-color:#ffdda0}
.zshop-item.selected{border:2px solid #f5c979;background:#3d304a}
.zshop-item:disabled{opacity:.45;cursor:default}
.zshop-icon{font-size:clamp(15px,2.2cqw,23px);line-height:1}
.zshop-item-name{font-size:clamp(11px,1.7cqw,17px);font-weight:800;
  overflow-wrap:break-word;line-height:1.05}
.zshop-item-cost,.zshop-item-owned{font-size:clamp(11px,1.52cqw,16px);font-weight:800;
  line-height:1.05;color:#ffe0a2}
.zshop-item-owned{color:#d8f4e1}
.zshop-details{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:space-around;gap:.22cqw;padding:.48cqw;
  text-align:center}
.zshop-detail-icon{font-size:clamp(20px,3.1cqw,34px);line-height:1}
.zshop-detail-name{font:700 clamp(14px,2.1cqw,22px)/1.08 Georgia,serif;color:#ffe0a7}
.zshop-detail-description{font-size:clamp(11px,1.65cqw,17px);font-weight:600;
  color:#f2e9dd;line-height:1.12;overflow-wrap:break-word}
.zshop-detail-price{font-size:clamp(14px,1.8cqw,20px);font-weight:900;color:#ffd794}
.zshop-action{width:100%;min-height:3.25cqw;flex-shrink:0;
  border:1px solid #ffe6b5;border-radius:.35cqw;
  background:linear-gradient(#ffe9b2,#c89b5b);color:#281e28;
  font-size:clamp(12px,1.7cqw,18px);font-weight:900;padding:.34cqw .4cqw}
.zshop-action:disabled{opacity:.4;cursor:default}
.zshop-trade-actions{flex:0 0 auto;display:flex;justify-content:center;
  padding:0 .65cqw .55cqw}
.zshop-trade-actions .zshop-action{width:auto;min-width:33%;min-height:3cqw}
.zshop-status{flex:0 0 auto;font-size:clamp(10px,1.28cqw,14px);text-align:center;
  padding:0 .5cqw .3cqw;color:#f5dbab;line-height:1.1}
/* On narrow landscape screens prioritize readable labels over decorative emoji. */
@container (max-width:650px){
  .zshop-title{font-size:clamp(15px,2.6cqw,20px)}
  .zshop-work{gap:.4cqw;padding:.35cqw}
  .zshop-panel-head{padding:.2cqw .35cqw}
  .zshop-panel-head small{display:none}
  .zshop-grid{padding:.3cqw;gap:.3cqw}
  .zshop-item{gap:0;padding:.12cqw}
  .zshop-icon{font-size:14px}
  .zshop-item-name{font-size:11px}
  .zshop-item-cost,.zshop-item-owned{font-size:10px}
  .zshop-detail-description{font-size:10px}

}
/* Keep shared HUD entirely within the 16:9 artwork's visible left edge. */
/* Keep shared HUD entirely within the 16:9 artwork's visible left edge. */
.shop-player-hud { top: 2%; left: 7%; }
/* Clear the HUD and align with the visible image edge like other VHouse pages. */

.shop-message { z-index: 35; }
[hidden] { display: none !important; }
/* Thin market ticker follows the actual name/cash HUD width. */
#townMarketTicker{
 position:absolute;z-index:25;display:block;height:clamp(17px,1.6cqw,26px);
 top:1%;right:1%;left:32%;overflow:hidden;white-space:nowrap;
 border:1px solid #d7ad61;border-radius:4px;background:#21142def;
 color:#fff;text-decoration:none;font:700 clamp(8px,.72cqw,12px) Arial,sans-serif;
 line-height:1;box-shadow:0 1px 5px #0008;
}
#townMarketTicker[hidden]{display:none!important}
#townMarketTicker .ticker-track{display:flex;width:max-content;height:100%;align-items:center;animation:town-market-scroll 30s linear infinite}
#townMarketTicker .ticker-group{display:flex;align-items:center;flex-shrink:0;height:100%;gap:1cqw;padding-right:1cqw}
#townMarketTicker .ticker-item{display:inline-flex;align-items:center;gap:.35cqw}
#townMarketTicker .ticker-symbol{color:#f4d79f}

#townMarketTicker .ticker-down{color:#fa8497}
#townMarketTicker .ticker-neutral{color:#ad9fbc}
#townMarketTicker:hover .ticker-track,#townMarketTicker:focus-visible .ticker-track{animation-play-state:paused}
@keyframes town-market-scroll{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#townMarketTicker .ticker-track{animation:none}}

/* Town navigation: anchored to the same edge as the live market ticker. */
#townNav{position:absolute;left:32%;right:1%;top:5%;z-index:26;container-type:inline-size;color:#ffe6b7;pointer-events:none}
#townNav[hidden],#townNav [hidden]{display:none!important}
#townNav .tn-row{display:flex;align-items:center;gap:.7cqw}
#townNav .tn-toggle{width:5.5cqw;height:5.5cqw;min-width:25px;min-height:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:none;background:#160b23;border:1px solid #dfb45d;border-radius:5px;cursor:pointer;pointer-events:auto}
#townNav .tn-toggle i{display:block;width:55%;height:2px;background:#ffdb86;border-radius:2px;transition:.25s}
#townNav.open .tn-toggle i:nth-child(1){transform:translateY(5px) rotate(45deg)}
#townNav.open .tn-toggle i:nth-child(2){opacity:0}
#townNav.open .tn-toggle i:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
#townNav .tn-reveal{flex:1;min-width:0;clip-path:inset(0 100% 0 0);transition:clip-path .4s;pointer-events:none}
#townNav.open .tn-reveal{clip-path:inset(0);pointer-events:auto}
#townNav .tn-bar{position:relative;height:8cqw;min-height:29px;display:flex;align-items:center;background:#160b23;border:1px solid #bd9959;border-radius:5px}
#townNav .tn-categories{display:flex;width:65%;gap:.8cqw;padding:0 .7cqw;z-index:3}
#townNav .tn-categories button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:.55cqw;height:4.8cqw;min-height:20px;border:1px solid #b08a50;border-radius:99px;background:linear-gradient(#2c1939,#150a22);color:#fff0d7;font:700 clamp(8px,1.65cqw,16px) Arial;white-space:nowrap;cursor:pointer;padding:0 .7cqw}
#townNav .tn-categories svg{flex:none;width:2.5cqw;height:2.5cqw;stroke:#ffcd65;fill:none;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round}
#townNav .tn-categories button:hover,#townNav .tn-categories button.active{background:#48235c;border-color:#ffdc8a;box-shadow:0 0 1cqw #ffb72d70}
#townNav .tn-crest{position:absolute;right:3%;width:28%;height:94%;filter:drop-shadow(0 0 .4cqw #ffad4590)}
#townNav .tn-frame,#townNav .tn-inner{clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%)}
#townNav .tn-frame{height:100%;padding:.35cqw;background:linear-gradient(155deg,#81461f,#ffdc86 20%,#a15a2a 36%,#ffd368 48%,#fff1b3 52%,#ad6428 67%,#ffd16b 90%)}
#townNav .tn-inner{height:100%;display:flex;align-items:center;justify-content:center;color:#ffdb79;background:radial-gradient(ellipse,#401c50,#15091c 80%);font:900 3.2cqw Arial;letter-spacing:.05em}
#townNav .tn-gem{position:absolute;top:50%;width:1.8cqw;height:1.8cqw;transform:translateY(-50%) rotate(45deg);background:linear-gradient(135deg,#fff1a9,#b26b1b);border:1px solid #ffd473}
#townNav .tn-gem:after{content:"";position:absolute;inset:20%;background:linear-gradient(135deg,#fff,#ed72ff 40%,#8800c7 80%)}
#townNav .tn-gem-left{left:-.6cqw}
#townNav .tn-gem-right{right:-.6cqw}
#townNav .tn-dropdown{position:absolute;top:100%;width:min(46%,260px);margin-top:4px;border:1px solid #bc9357;border-radius:5px;background:linear-gradient(135deg,#271536,#160c24);padding:4px;color:#f4d79f;font:700 clamp(9px,1.5cqw,14px) Arial;pointer-events:auto}
#townNav .tn-option{display:flex;width:100%;align-items:center;justify-content:space-between;padding:clamp(4px,.9cqw,9px) 8px;border:0;border-bottom:1px solid #ba945533;background:transparent;color:#ffe6b7;text-align:left;text-decoration:none;font:inherit;cursor:pointer}
#townNav .tn-option:last-child{border-bottom:0}
#townNav .tn-option:hover{background:#462657;color:#fff}
#townNav .tn-children{padding:2px 0 2px 7px;border-left:1px solid #bc9357;margin-left:7px}
#townNav .tn-children .tn-option{font-weight:500;color:#ecdbf6}
@media(prefers-reduced-motion:reduce){#townNav *{transition:none!important}}
</style>

<div class="rotate-screen">
  <div class="rotate-icon" aria-hidden="true">↻</div>
  <h2>Rotate Your Phone</h2>
  <p>Please turn your device sideways to play.</p>
</div>
<main class="game-container">
  <div class="map-container">
    <img class="game-map" src="assets/V%20Shop.png?v=20261102" alt="VHouse Shop interior" draggable="false">

    <!-- Clickable shop displays: left, center, right. -->
    <div class="shop-hotspot-layer">
      <button type="button" class="vhouse-btn map-hotspot shop-hotspot hotspot-mission-boosts"
        data-menu="Mission Boosts" data-label="Mission Boosts" aria-label="Mission Boosts"></button>
      <button type="button" class="vhouse-btn map-hotspot shop-hotspot hotspot-journey-service"
        data-menu="Journey Service" data-label="Journey Service" aria-label="Journey Service"></button>
      <button type="button" class="vhouse-btn map-hotspot shop-hotspot hotspot-trade-scraps"
        data-menu="Trade Scraps" data-label="Trade Scraps" aria-label="Trade Scraps"></button>
    </div>

    <aside class="vhouse-player-hud shop-player-hud" aria-label="Player information">
      <div data-vhouse-player role="img" aria-label="Active VCard"></div>
      <div data-vhouse-info aria-live="polite"></div>

    <a id="townMarketTicker" href="./VMarketDex.html" aria-label="VHouse Market DEX live ticker" hidden>
      <span class="ticker-track"><span class="ticker-group"></span><span class="ticker-group" aria-hidden="true"></span></span>
    </a>


    <nav id="townNav" aria-label="VHouse navigation" hidden>
      <div class="tn-row">
        <button type="button" class="tn-toggle" aria-label="Navigation menu" aria-expanded="false"><i></i><i></i><i></i></button>
        <div class="tn-reveal" inert>
          <div class="tn-bar">
            <div class="tn-categories">
              <button type="button" data-menu="how" aria-expanded="false"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12"/><path d="M11 11a5 5 0 1 1 8 4c-3 2-3 3-3 5M16 24h.01"/></svg>How 2</button>
              <button type="button" data-menu="earn" aria-expanded="false"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12"/><path d="M16 7v18M22 11H13a4 4 0 0 0 0 8h6a4 4 0 0 1 0 8"/></svg>Earn</button>
              <button type="button" data-menu="vcard" aria-expanded="false"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="21" rx="3"/><path d="M6 12h20M8 21h7M22 17v7M19 20h6"/></svg>VCard</button>
              <button type="button" data-menu="market" aria-expanded="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 12L6 4h20l3 8M3 12h26v5H3zM6 17v12h20V17M13 29V20h7v9M11 4l-2 8M21 4l2 8"/></svg>Market</button>

<script>
const shopMenuOverlay = document.getElementById("shopMenuOverlay");
const shopMenuWindow = shopMenuOverlay.querySelector(".shop-menu-window");
const shopMenuContent = document.getElementById("shopMenuContent");
let shopMenuTrigger = null;
let activeShop = "Mission Boosts";
let shopStatus = "";

const boosts = [
  { name:"Lucky Charm", icon:"🍀", price:600, desc:"Journey only. Each charm grants 1 Lucky Retry and +1% to player stats. Maximum 5. Consumed when a retry is used." },
  { name:"Lucky Stone", label:"Raid Stones", icon:"🪨", price:600, desc:"Raid only. Each stone grants 1 Lucky Retry and +1% to Raid stats. Maximum 5. Consumed when a Raid retry is used." },
  { name:"Swift Boots", icon:"🥾", price:1200, desc:"Each pair in inventory grants +1 SPEED. Use a pair to reduce Journey time by 15 seconds, once per Stage. Used boots are consumed, reducing SPEED by 1." },
  { name:"Hunt Lantern", icon:"🏮", price:1800, desc:"Nullifies the Stage's RPS advantage for one encounter, once. The lantern is consumed after use." },
  { name:"Stage Ticket", icon:"🎟️", price:2400, desc:"Enter one Stage without paying its entry fee. One ticket is consumed per entry." }
];
const services = [
  { name:"Emergency Recall Ticket", icon:"🚨", price:5000, desc:"Bring 1 VCard or ALL VCards home early from active Journeys. Keep rewards already earned; forfeit rewards from unresolved encounters." }
];
const tradeCatalog = {
  scrap:{name:"Scrap Metal",icon:"⚙️",value:15},
  copper:{name:"Copper Parts",icon:"🔩",value:30},
  relic:{name:"Old Relic",icon:"🏺",value:60},
  crystal:{name:"Crystal",icon:"💎",value:45},
  repair:{name:"Repair Kit",icon:"🧰",value:90},
  token:{name:"Journey Token",icon:"🪙",value:120}
};
const ownedScraps={scrap:12,copper:5,relic:2,crystal:0,repair:0,token:0};
const shopStock={scrap:0,copper:0,relic:0,crystal:6,repair:4,token:3};
let selectedBoost=0,selectedService=0,tradeFrom="scrap",tradeTo="crystal";
let shopCash=null, shopInventory=new Map(), shopBusy=false, shopLoading=false;
let shopReservedStones=0;
let shopReadId=0, shopPlayerId=null;
let shopActiveJourneys=[];
const shopSafe=value=>String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const purchasedItemNames=new Set([...boosts,...services].map(item=>item.name));

async function loadShopPlayer(){
  const readId=++shopReadId;
  shopCash=null;
  shopInventory=new Map();
  shopReservedStones=0;
  shopPlayerId=null;
  shopActiveJourneys=[];
  shopLoading=true;
  if(!shopMenuOverlay.hidden)renderShop();
  try{
    const auth=window.VHouseAuth;
    await auth.ready;
    const player=await auth.loadPlayerData();
    if(readId!==shopReadId)return;
    if(!player){
      shopStatus="Sign in to view your inventory and buy items.";
      return;
    }
    shopPlayerId=player.playerId;
    shopCash=Number(player.account?.igm_balance);
    if(!Number.isFinite(shopCash)||shopCash<0)throw Error("Invalid VCARD CASH balance.");
    for(const item of player.inventory){
      if(item.type==="Item"&&purchasedItemNames.has(item.thing)){
        shopInventory.set(item.thing,Number(item.quantity)||0);
      }
    }
    const [journeyResult,raidResult]=await Promise.all([
      auth.getClient().from("vhouse_journey_records")
        .select("card_id,snapshot").eq("player_id",player.playerId)
        .eq("status","ON_JOURNEY"),
      auth.getClient().from("vhouse_raid_records")
        .select("card_snapshot").eq("player_id",player.playerId)
        .in("status",["ACTIVE","RESULTS_READY"]).limit(1).maybeSingle()
    ]);
    if(journeyResult.error)throw journeyResult.error;
    if(raidResult.error)throw raidResult.error;
    if(readId!==shopReadId||auth.getUser()?.id!==player.playerId)return;
    shopActiveJourneys=(journeyResult.data||[]).map(journey=>({
      id:journey.card_id,name:journey.snapshot?.card?.name||"VCard"
    }));
    const raidSnapshot=raidResult.data?.card_snapshot;
    shopReservedStones=raidSnapshot?.raidLuckyStonesReserved===true
      ?Math.max(0,Math.floor(Number(raidSnapshot.raidLuckyStones)||0)):0;
  }catch(error){
    if(readId!==shopReadId)return;
    console.error("Shop account load:",error);
    shopCash=null;
    shopStatus="Unable to load player inventory.";
  }finally{
    if(readId===shopReadId){
      shopLoading=false;
      if(!shopMenuOverlay.hidden)renderShop();
    }
  }
}
async function buyShopItem(item){
  if(shopBusy||shopLoading)return;
  const auth=window.VHouseAuth;
  if(!shopPlayerId||auth?.getUser?.()?.id!==shopPlayerId){
    shopStatus="Sign in to buy items.";
    renderShop();
    return;
  }
  if((item.name==="Lucky Charm"||item.name==="Lucky Stone")&&
      (shopInventory.get(item.name)||0)+(item.name==="Lucky Stone"?shopReservedStones:0)>=5){
    shopStatus=item.name==="Lucky Stone"?"Maximum 5 Raid Stones.":"Maximum 5 Lucky Charms.";
    renderShop();
    return;
  }
  if(shopCash===null||shopCash<item.price){
    shopStatus="Insufficient VCARD CASH.";
    renderShop();
    return;
  }
  shopBusy=true;
  renderShop();
  try{
    const buyerId=shopPlayerId;
    const {data,error}=await auth.getClient().rpc("vhouse_buy_shop_item",{p_thing:item.name});
    if(error)throw error;
    if(auth.getUser()?.id!==buyerId)throw Error("Account changed during purchase.");
    const balance=Number(data?.igm_balance),quantity=Number(data?.quantity);
    if(!Number.isFinite(balance)||!Number.isInteger(quantity))throw Error("Invalid purchase receipt.");
    shopCash=balance;
    shopInventory.set(item.name,quantity);
    shopStatus=(item.label||item.name)+" purchased.";
    window.dispatchEvent(new Event("vhouse:cash-updated"));
    window.dispatchEvent(new Event("vhouse:inventory-updated"));
  }catch(error){
    console.error("Shop purchase:",error);
    const message=String(error?.message||"");
    shopStatus=message.includes("INSUFFICIENT_IGM")?"Insufficient VCARD CASH.":
      message.includes("LUCKY_STONE_LIMIT_5")?"Maximum 5 Raid Stones.":
       message.includes("LUCKY_CHARM_LIMIT_5")?"Maximum 5 Lucky Charms.":
      message.includes("SIGN_IN_REQUIRED")?"Sign in to buy items.":
      "Purchase unsuccessful. No items granted.";
    // Fetch authoritative state again if the connection failed after the server processed a purchase.
    shopBusy=false;
    await loadShopPlayer();
  }finally{
    shopBusy=false;
    if(!shopMenuOverlay.hidden)renderShop();
  }
}

async function recallShopJourneys(all){
  if(shopBusy||shopLoading)return;
  if(!shopPlayerId||window.VHouseAuth?.getUser?.()?.id!==shopPlayerId){
    shopStatus="Sign in to recall your VCards.";renderShop();return;
  }
  if((shopInventory.get("Emergency Recall Ticket")||0)<1){
    shopStatus="You need an Emergency Recall Ticket.";renderShop();return;
  }
  const target=all?null:shopMenuContent.querySelector("#shopRecallCard")?.value;
  if(!all&&!target){shopStatus="Select a VCard to recall.";renderShop();return;}
  shopBusy=true;
  renderShop();
  try{
    const auth=window.VHouseAuth;
    const {data,error}=await auth.getClient().rpc("vhouse_recall_item_journeys",{p_card_id:target});
    if(error)throw error;
    shopStatus=data.recalledCount+" VCard"+(data.recalledCount===1?"":"s")+" recalled. Results ready.";
    window.dispatchEvent(new Event("vhouse:inventory-updated"));
    window.dispatchEvent(new Event("vhouse:cash-updated"));
    shopBusy=false;
    await loadShopPlayer();
  }catch(error){
    console.error("Journey recall:",error);
    const message=String(error?.message||"");
    shopStatus=message.includes("NO_ACTIVE_JOURNEYS")?"No active Journeys to recall.":
      message.includes("RECALL_TICKET_NOT_OWNED")?"You need an Emergency Recall Ticket.":
      "Recall failed. Ticket was not used.";
  }finally{
    shopBusy=false;
    if(!shopMenuOverlay.hidden)renderShop();
  }
}

function shopItem(item,subtitle,extra,action,index,selected,disabled=false){
  return '<button type="button" class="zshop-item'+(selected?' selected':'')+
    '" data-shop-action="'+action+'" data-index="'+index+'" aria-pressed="'+selected+'"'+
    (disabled?' disabled':'')+'>'+
    '<span class="zshop-icon">'+item.icon+'</span>'+
    '<span class="zshop-item-name">'+(item.label||item.name)+'</span>'+
    '<span class="zshop-item-cost">'+subtitle+'</span>'+
    (extra?'<span class="zshop-item-owned">'+extra+'</span>':'')+
    '</button>';
}
function shopPanel(title,subtitle,body){
  return '<section class="zshop-panel"><div class="zshop-panel-head"><strong>'+title+
    '</strong><small>'+subtitle+'</small></div>'+body+'</section>';
}
function renderShop(){
  let body,footer="",title=activeShop.toUpperCase();
  if(activeShop==="Mission Boosts" || activeShop==="Journey Service"){
    const isBoost=activeShop==="Mission Boosts";
    const items=isBoost?boosts:services;
    const selected=isBoost?selectedBoost:selectedService;
    const item=items[selected];
    const list=items.map((v,i)=>shopItem(v,v.price?v.price.toLocaleString()+" IGM":"FREE",
      "OWNED: "+(shopInventory.get(v.name)||0),
      isBoost?"select-boost":"select-service",i,selected===i)).join("");
    const recallOwned=shopInventory.get("Emergency Recall Ticket")||0;
    const recallControls=!isBoost
      ?'<div class="shop-recall-controls" style="display:grid;gap:5px;width:100%;font-size:11px">'+
        '<select id="shopRecallCard" aria-label="Choose VCard to recall" style="min-width:0;width:100%;padding:5px;color:#ffe2ab;background:#21162c;border:1px solid #bc9357">'+
        (shopActiveJourneys.length?shopActiveJourneys.map(card=>
          '<option value="'+shopSafe(card.id)+'">'+shopSafe(card.name)+'</option>').join("")
          :'<option value="">No active Journeys</option>')+'</select>'+
        '<div style="display:flex;gap:5px">'+
        '<button class="zshop-action" style="min-width:0;flex:1" data-shop-action="recall-one"'+
        (shopBusy||shopLoading||recallOwned<1||!shopActiveJourneys.length?' disabled':'')+'>RECALL 1</button>'+
        '<button class="zshop-action" style="min-width:0;flex:1" data-shop-action="recall-all"'+
        (shopBusy||shopLoading||recallOwned<1||!shopActiveJourneys.length?' disabled':'')+'>RECALL ALL</button>'+
        '</div></div>':'';
    const detail='<div class="zshop-details">'+
      '<div class="zshop-detail-icon">'+item.icon+'</div>'+
      '<strong class="zshop-detail-name">'+(item.label||item.name)+'</strong>'+
      '<p class="zshop-detail-description">'+item.desc+'</p>'+
      (item.name==="Lucky Stone"&&shopReservedStones>0
        ?'<small>🪨 ON RAID: '+shopReservedStones+' · INVENTORY: '+(shopInventory.get(item.name)||0)+'</small>':'')+
      '<strong class="zshop-detail-price">'+(item.price?item.price.toLocaleString()+" IGM":"FREE")+'</strong>'+
      '<button class="zshop-action" type="button" data-shop-action="'+(isBoost?"buy-boost":"use-service")+
      '"'+(shopBusy||shopLoading||shopCash===null||shopCash<item.price||
        ((item.name==="Lucky Charm"||item.name==="Lucky Stone")&&
         (shopInventory.get(item.name)||0)+(item.name==="Lucky Stone"?shopReservedStones:0)>=5)?' disabled':'')+
      '>'+(isBoost?"BUY BOOST":"BUY TICKET")+'</button>'+recallControls+'</div>';
    body='<div class="zshop-work">'+shopPanel(isBoost?"BOOST ITEMS":"TICKETS","AVAILABLE",
      '<div class="zshop-grid'+(isBoost?' boost-grid':' service-grid')+'">'+list+'</div>')+
      shopPanel("DETAILS","SELECTED",detail)+'</div>';
  }else{
    if(!ownedScraps[tradeFrom]){
      tradeFrom=Object.keys(ownedScraps).find(key=>ownedScraps[key]>0)||"scrap";
    }
    const playerItems=Object.keys(ownedScraps).filter(key=>ownedScraps[key]>0)
      .map(key=>shopItem(tradeCatalog[key],"Owned: "+ownedScraps[key],
        tradeCatalog[key].value+" trade value","select-player",key,key===tradeFrom)).join("");
    const available=["crystal","repair","token"].map(key=>shopItem(tradeCatalog[key],
      "Stock: "+shopStock[key],tradeCatalog[key].value+" trade value",
      "select-stock",key,key===tradeTo,!shopStock[key])).join("");
    const cost=Math.ceil(tradeCatalog[tradeTo].value/tradeCatalog[tradeFrom].value);
    const canTrade=ownedScraps[tradeFrom]>=cost&&shopStock[tradeTo]>0;
    body='<div class="zshop-work trade-layout">'+shopPanel("YOUR ITEMS","INVENTORY",
      '<div class="zshop-grid">'+playerItems+'</div>')+
      shopPanel("SHOP ITEMS","AVAILABLE",'<div class="zshop-grid">'+available+'</div>')+'</div>'+
      '<div class="zshop-trade-actions"><button class="zshop-action" data-shop-action="confirm-trade"'+
      (canTrade?'':' disabled')+'>CONFIRM TRADE</button></div>';
  }
  if(shopStatus)footer='<div class="zshop-status" role="status">'+shopStatus+'</div>';
  shopMenuContent.innerHTML='<div class="zshop">'+
    '<h2 class="zshop-title">'+title+'</h2>'+body+footer+'</div>';
  shopMenuWindow.setAttribute("aria-label",activeShop);
}
shopMenuContent.addEventListener("click",event=>{
  const button=event.target.closest("button[data-shop-action]");
  if(!button||button.disabled)return;
  const action=button.dataset.shopAction;
  const index=button.dataset.index;
  shopStatus="";
  if(action==="select-boost")selectedBoost=Number(index);
  if(action==="select-service")selectedService=Number(index);
  if(action==="select-player")tradeFrom=index;
  if(action==="select-stock")tradeTo=index;
  if(action==="recall-one"||action==="recall-all"){
    void recallShopJourneys(action==="recall-all");
    return;
  }
  if(action==="buy-boost"||action==="use-service"){
    const item=action==="buy-boost"?boosts[selectedBoost]:services[selectedService];
    void buyShopItem(item);
    return;
  }
  if(action==="confirm-trade"){
    const count=Math.ceil(tradeCatalog[tradeTo].value/tradeCatalog[tradeFrom].value);
    if(ownedScraps[tradeFrom]>=count&&shopStock[tradeTo]>0){
      ownedScraps[tradeFrom]-=count;
      shopStock[tradeFrom]+=count;
      shopStock[tradeTo]--;
      ownedScraps[tradeTo]++;
      shopStatus="Trade complete.";
    }
  }
  renderShop();
});
document.querySelectorAll(".shop-hotspot").forEach(button=>{
  button.addEventListener("click",()=>{
    shopMenuTrigger=button;
    activeShop=button.dataset.menu;
    shopStatus="";
    shopMenuOverlay.hidden=false;
    renderShop();
    if(activeShop==="Mission Boosts"||activeShop==="Journey Service"){
      void loadShopPlayer();
    }
  });
});
window.VHouseAuth?.subscribe(()=>{
  ++shopReadId;
  shopCash=null;shopInventory=new Map();shopReservedStones=0;shopPlayerId=null;shopActiveJourneys=[];
  if(!shopMenuOverlay.hidden&&activeShop!=="Trade Scraps")void loadShopPlayer();
});
window.addEventListener("pageshow",()=>{
  if(!shopMenuOverlay.hidden&&activeShop!=="Trade Scraps")void loadShopPlayer();
});
function closeShopMenu(){
  if(shopMenuOverlay.hidden)return;
  shopMenuOverlay.hidden=true;
  ++shopReadId;
  shopMenuContent.replaceChildren();
  if(shopMenuTrigger)shopMenuTrigger.focus();
}
shopMenuOverlay.addEventListener("click",event=>{
  // Only the actual backdrop closes the menu; clicking rebuilt shop buttons does not.
  if(event.target===shopMenuOverlay)closeShopMenu();
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape")closeShopMenu();
});
</script>

<script>
(()=>{
 const ticker=document.getElementById("townMarketTicker");
 const stage=ticker.closest(".map-container");
 const hud=stage.querySelector(".shop-player-hud");
 const groups=ticker.querySelectorAll(".ticker-group");
 const api=window.VHouseMarketData;
 if(!api)return;
 const market=api.create({sessionCache:true});
 let busy=false,stale=false,account=null;
 const resize=new ResizeObserver(place);
 function place(){
  const next=hud.querySelector(".vhouse-player-account-box");
  if(next!==account){if(account)resize.unobserve(account);account=next;if(account)resize.observe(account);}
  const b=account?.getBoundingClientRect(),frame=stage.getBoundingClientRect();
  if(!b||!b.width||!b.height||!frame.width){ticker.hidden=true;return;}
  const gap=Math.max(5,frame.width*.006);
  const left=b.right-frame.left+gap;
  if(frame.width-left-gap<90){ticker.hidden=true;return;}
  ticker.style.left=left+"px";ticker.style.top=(b.top-frame.top)+"px";
  ticker.hidden=false;
 }
 function render(){
  const parts=api.assets.map(a=>{
   const row=document.createElement("span");row.className="ticker-item";
   const sym=document.createElement("span");sym.className="ticker-symbol";sym.textContent=a.symbol;
   const price=document.createElement("span");price.textContent=api.money(market.displayPrice(a));
   const c=market.changeFor(a),change=document.createElement("span");
   change.className=c===null?"ticker-neutral":c>0?"ticker-up":c<0?"ticker-down":"ticker-neutral";change.textContent=api.percent(c);
   row.append(sym,price,change);return row;
  });
  if(stale){const notice=document.createElement("span");notice.className="ticker-neutral";notice.textContent="Market refresh unavailable";parts.push(notice);}
  groups[0].replaceChildren(...parts);
  groups[1].replaceChildren(...parts.map(p=>p.cloneNode(true)));
 }
 async function refresh(){
  if(busy)return;busy=true;
  try{await market.refresh();stale=false}catch{stale=true}
  finally{busy=false;render()}
 }
 resize.observe(stage);resize.observe(hud);
 new MutationObserver(place).observe(hud,{subtree:true,childList:true,attributes:true,attributeFilter:["hidden"]});
 render();place();void refresh();
 setInterval(()=>{if(!document.hidden)void refresh()},api.refreshMs);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)void refresh()});
})();
</script>
<script>
(()=>{
 const menu=document.getElementById("townNav"),ticker=document.getElementById("townMarketTicker");
 const stage=menu.closest(".map-container"),toggle=menu.querySelector(".tn-toggle"),reveal=menu.querySelector(".tn-reveal"),drop=menu.querySelector(".tn-dropdown"),buttons=[...menu.querySelectorAll("[data-menu]")];
 const entries={
  how:[],
  earn:[["Mission Journeys","./index.html?journey=1"],["Raids","./TowerRaidInfo.html"],["Eggs","./TowerRaidInfo.html"]],
  vcard:[["Create",[["Mint VCard","./VCardCreator.html"],["Load NFT","./VCardCreator.html"],["Upgrade VCard","./VCardCreator.html"],["Burn VCard","./VCardCreator.html"]]],["Billboard",[["SOL","./Vhouse.html?billboard=1"],["Journey","./VCloset.html?stats=1"],["Raid","./RaidBoss.html"]]]],
  market:[["VMarket DEX",[["Coins","./VMarketDex.html"]]],["Shop",[["Items","./Vshop.html"]]]]
 };
 let active=null;
 function clearCategory(){active=null;drop.hidden=true;buttons.forEach(b=>{b.classList.remove("active");b.setAttribute("aria-expanded","false")});}
 function close(){menu.classList.remove("open");toggle.setAttribute("aria-expanded","false");reveal.inert=true;clearCategory();}
 function position(){
  const b=ticker.getBoundingClientRect(),frame=stage.getBoundingClientRect();
  if(ticker.hidden||!b.width||!b.height){menu.hidden=true;close();return;}
  menu.style.left=(b.left-frame.left)+"px";
  menu.style.top=(b.bottom-frame.top+Math.max(3,frame.width*.003))+"px";
  menu.hidden=false;
  if(active&&!drop.hidden)alignDrop(active);
 }
 function alignDrop(button){
  const offset=button.getBoundingClientRect().left-menu.getBoundingClientRect().left;
  drop.style.left=Math.max(0,Math.min(offset,menu.clientWidth-drop.offsetWidth))+"px";
 }
 function row(label,href){
  const b=document.createElement(href?"a":"button");
  if(href)b.href=href;else b.type="button";
  b.className="tn-option";b.textContent=label;return b;
 }
 toggle.addEventListener("click",()=>{
  if(menu.classList.contains("open")){close();return;}
  menu.classList.add("open");toggle.setAttribute("aria-expanded","true");reveal.inert=false;
 });
 buttons.forEach(button=>button.addEventListener("click",()=>{
  if(active===button){clearCategory();return;}
  clearCategory();active=button;button.classList.add("active");
  drop.replaceChildren();
  const items=entries[button.dataset.menu];
  if(!items.length)return;
  items.forEach(([label,destination,action])=>{
   const parent=row(label,typeof destination==="string"?destination:null);drop.append(parent);
   if(Array.isArray(destination)){
    const arrow=document.createElement("span");arrow.textContent="⌄";parent.append(arrow);parent.setAttribute("aria-expanded","false");
    const children=document.createElement("div");children.className="tn-children";children.hidden=true;
    destination.forEach(([name,href])=>children.append(row(name,href)));
    drop.append(children);
    parent.addEventListener("click",()=>{children.hidden=!children.hidden;parent.setAttribute("aria-expanded",String(!children.hidden));arrow.textContent=children.hidden?"⌄":"⌃";});
   }
  });
  drop.hidden=false;button.setAttribute("aria-expanded","true");alignDrop(button);
 }));
 document.addEventListener("click",e=>{if(menu.classList.contains("open")&&!menu.contains(e.target))close();});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&menu.classList.contains("open")){close();toggle.focus();}});
 const observer=new ResizeObserver(position);observer.observe(stage);observer.observe(ticker);
 new MutationObserver(position).observe(ticker,{attributes:true,attributeFilter:["style","hidden"]});
 position();
})();
</script>
