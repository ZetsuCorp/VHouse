<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHouse Shop</title>
<link rel="stylesheet" href="assets/vhouse-buttons.css">
<link rel="stylesheet" href="assets/vhouse-player.css">
<link rel="stylesheet" href="assets/vhouse-info.css">
<link rel="stylesheet" href="assets/vhouse-message.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
.rotate-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  color: #fff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 24px;
}
.rotate-icon { font-size: 64px; }
.rotate-screen h2 { font-size: 24px; }
.rotate-screen p { font-size: 16px; color: #bbb; }
@media (orientation: portrait) {
  .rotate-screen { display: flex; }
  .game-container { display: none !important; }
}
.game-container {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.map-container {
  position: relative;
  width: min(100vw, 200dvh);
  aspect-ratio: 2 / 1;
  flex-shrink: 0;
}
.game-map {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
/* The artwork is 16:9 inside the shared 2:1 game frame. */
.shop-hotspot-layer {
  position: absolute;
  inset-block: 0;
  left: 50%;
  width: 88.888889%;
  transform: translateX(-50%);
  pointer-events: none;
}
.shop-hotspot {
  pointer-events: auto;
}
/* The three marked areas, left to right, on the shop artwork. */
.hotspot-mission-boosts { left: 4.4%; top: 34%; width: 20.2%; height: 28.5%; }
/* Keep the Mission Boosts hover label below the player HUD. */
.hotspot-mission-boosts::after { top: 85%; }
.hotspot-journey-service { left: 26.4%; top: 49%; width: 46.4%; height: 15.5%; }
.hotspot-trade-scraps { left: 81.8%; top: 64.7%; width: 18%; height: 35%; }

/* Reuse the existing VHouse menu frame; don't resize the game artwork. */
.shop-menu-overlay {
  position: absolute;
  inset: 0;
  z-index: 40;
}
.shop-menu-window {
  position: absolute;
  top: 5.96%;
  left: 50%;
  width: 55.99%;
  height: 69.91%;
  transform: translateX(-50%);
  container-type: inline-size;
}
.shop-menu-window iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
  pointer-events: none;
}
/* The clickable shop page sits inside the existing Vcontainer image's content area. */
.shop-menu-content {
  position: absolute;
  left: 13.3%;
  top: 26%;
  width: 73.4%;
  height: 53.6%;
  overflow: hidden;
  pointer-events: none;
}
.shop-menu-window iframe.shop-interface {
  position: absolute;
  display: block;
  left: 0;
  top: 0;
  border: 0;
  background: transparent;
  pointer-events: auto;
  transform-origin: top left;
}
/* Keep shared HUD entirely within the 16:9 artwork's visible left edge. */
.shop-player-hud { top: 2%; left: 7%; }
/* Clear the HUD and align with the visible image edge like other VHouse pages. */
.shop-back-button {
  position: absolute;
  left: 5.56%;
  top: 70%;
  transform: translate(-50%, -50%);
  z-index: 30;
}
.shop-message { z-index: 35; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="rotate-screen">
  <div class="rotate-icon" aria-hidden="true">↻</div>
  <h2>Rotate Your Phone</h2>
  <p>Please turn your device sideways to play.</p>
</div>
<main class="game-container">
  <div class="map-container">
    <img class="game-map" src="assets/V%20Shop.png?v=20261102" alt="VHouse Shop interior" draggable="false">

    <!-- Clickable shop displays: left, center, right. -->
    <div class="shop-hotspot-layer">
      <button type="button" class="vhouse-btn map-hotspot shop-hotspot hotspot-mission-boosts"
        data-menu="Mission Boosts" data-label="Mission Boosts" aria-label="Mission Boosts"></button>
      <button type="button" class="vhouse-btn map-hotspot shop-hotspot hotspot-journey-service"
        data-menu="Journey Service" data-label="Journey Service" aria-label="Journey Service"></button>
      <button type="button" class="vhouse-btn map-hotspot shop-hotspot hotspot-trade-scraps"
        data-menu="Trade Scraps" data-label="Trade Scraps" aria-label="Trade Scraps"></button>
    </div>

    <aside class="vhouse-player-hud shop-player-hud" aria-label="Player information">
      <div data-vhouse-player role="img" aria-label="Active VCard"></div>
      <div data-vhouse-info aria-live="polite"></div>
    </aside>

    <!-- Available for future shop information; hidden until the game supplies a message. -->
    <div id="shopMessage" class="vhouse-message--game shop-message"
      data-vhouse-message aria-live="polite" hidden></div>

    <!-- The existing shop menu frame contains one independently interactive shop page. -->
    <div id="shopMenuOverlay" class="shop-menu-overlay" hidden>
      <div class="shop-menu-window" role="dialog" aria-modal="true" aria-label="Shop menu">
        <iframe src="./vcontainer.html" title="VHouse Shop Menu Frame" tabindex="-1" aria-hidden="true"></iframe>
        <div id="shopMenuContent" class="shop-menu-content">
          <iframe id="shopInterface" class="shop-interface" title="Shop Interface"></iframe>
        </div>
      </div>
    </div>

    <a class="vhouse-btn back-button shop-back-button" href="./index.html">← BACK</a>
  </div>
</main>
<script>
const shopMenuOverlay = document.getElementById("shopMenuOverlay");
const shopMenuWindow = shopMenuOverlay.querySelector(".shop-menu-window");
const shopMenuContent = document.getElementById("shopMenuContent");
const shopInterface = document.getElementById("shopInterface");
const shopPages = {
  "Mission Boosts": "./MissionBoosts.html?v=legible-20261103",
  "Journey Service": "./JourneyService.html?v=legible-20261103",
  "Trade Scraps": "./TradeScraps.html?v=legible-20261103"
};

/* Display the shops at their actual text sizes instead of shrinking a 900px page. */
function fitShopInterface() {
  if (shopMenuOverlay.hidden || !shopInterface.contentDocument) return;
  const doc = shopInterface.contentDocument;
  if (!doc.querySelector("main")) return;

  shopInterface.style.width = "100%";
  shopInterface.style.height = "100%";
  shopInterface.style.left = "0";
  shopInterface.style.top = "0";
  shopInterface.style.transform = "none";

  // Apply compact sizing only in the embedded view; standalone shop pages are unchanged.
  if (doc.getElementById("vhouse-embedded-shop-style")) return;
  const style = doc.createElement("style");
  style.id = "vhouse-embedded-shop-style";
  style.textContent = `
    html,body{width:100%;height:100%;overflow:hidden;background:transparent!important}
    main{height:100%;width:100%;max-width:none!important;padding:0!important;display:flex;flex-direction:column}
    main>.shell{height:100%;width:100%;min-height:0;display:flex;flex-direction:column}
    main .top{padding:5px 8px!important;flex-shrink:0}
    main .eyebrow{font-size:11px!important;line-height:1.1!important}
    main h2{font-size:22px!important;line-height:1.08!important;margin:1px 0!important}
    main .money-box{min-width:0!important;padding:3px 6px!important}
    main .money-box small{font-size:11px!important;line-height:1!important;margin-bottom:2px!important}
    main .money-box strong{font-size:18px!important}
    main .main{flex:1;min-height:0;padding:5px!important;display:flex;flex-direction:column}
    main .body,main .sides{flex:1;min-height:0;gap:6px!important}
    main .panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
    main .panel-header{padding:5px 6px!important;min-height:27px;flex-shrink:0;flex-wrap:nowrap!important}
    main .panel-header strong{font-size:19px!important;line-height:1!important}
    main .panel-header small{font-size:14px!important;line-height:1!important}
    main .items{flex:1;min-height:0!important;grid-template-rows:repeat(2,minmax(0,1fr));gap:4px!important;padding:4px!important;align-content:stretch!important}
    main .item{min-height:0!important;gap:2px!important;padding:3px!important}
    main .art{font-size:22px!important;line-height:1!important}
    main .item-name,main .item-cost,main .owned,
    main .item-count,main .value{font-family:Arial,sans-serif!important;font-size:19px!important;font-weight:700!important;line-height:1.05!important}
    main .detail{flex:1;min-height:0!important;padding:4px!important;gap:3px!important}
    main .detail-icon{width:34px!important;height:34px!important;font-size:23px!important;flex-shrink:0}
    main .detail-name{font-size:19px!important;line-height:1.05!important}
    main .detail-copy{font-size:19px!important;line-height:1.1!important;min-height:0;overflow:hidden}
    main .detail-cost{font-size:19px!important;line-height:1.05!important}
    main .buy{font-size:19px!important;line-height:1.05!important;padding:5px!important;flex-shrink:0}
    main .status{font-size:15px!important;line-height:1.1!important;min-height:0!important;margin-top:3px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    main .actions{margin-top:4px!important;flex-shrink:0}
    main .trade-btn{font-size:19px!important;line-height:1.1!important;padding:5px 15px!important}
  `;
  doc.head.appendChild(style);
}
shopInterface.addEventListener("load", fitShopInterface);
new ResizeObserver(fitShopInterface).observe(shopMenuContent);
let shopMenuTrigger = null;
document.querySelectorAll(".shop-hotspot").forEach(button => {
  button.addEventListener("click", () => {
    shopMenuTrigger = button;
    shopMenuOverlay.hidden = false;
    shopInterface.title = button.dataset.menu;
    shopInterface.src = shopPages[button.dataset.menu];
  });
});
function closeShopMenu() {
  if (shopMenuOverlay.hidden) return;
  shopMenuOverlay.hidden = true;
  shopInterface.removeAttribute("src");
  if (shopMenuTrigger) shopMenuTrigger.focus();
}
shopMenuOverlay.addEventListener("click", event => {
  if (!shopMenuWindow.contains(event.target)) closeShopMenu();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeShopMenu();
});
</script>
<script src="assets/vhouse-cards.js"></script>
<script src="assets/vhouse-player.js"></script>
<script src="assets/vhouse-info.js"></script>
<script src="assets/vhouse-message.js"></script>
</body>
</html>
