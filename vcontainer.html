<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHouse Container</title>
<script>
const mode = new URLSearchParams(location.search).get("mode");
if (mode === "message" || mode === "journey") {
  document.documentElement.classList.add(mode + "-mode");
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}
.container-stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Scale the existing artwork and Journey content together. */
.container-art {
  position: relative;
  width: 100%;
  aspect-ratio: 1672 / 941;
  max-height: 100%;
}
.container-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
  border: 3px solid white;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.85);
  user-select: none;
  -webkit-user-drag: none;
}
/* Position content just inside the existing white border of Vcontainer.png. */
.journey-content {
  display: none;
  position: absolute;
  left: 13.3%;
  top: 26%;
  width: 73.4%;
  height: 53.6%;
  border: 0;
  background: transparent;
}
.journey-mode .journey-content { display: block; }
.message-mode .container-art { display: none; }
/* RESIZE THE SAME IMAGE FOR MESSAGES */
.message-mode .container-image {
  height: 100%;
  max-height: none;
  object-fit: fill;
}


</style>
<link rel="stylesheet" href="assets/vhouse-message.css">
<link rel="stylesheet" href="assets/vhouse-journey.css">
<link rel="stylesheet" href="assets/vhouse-frame.css">
</head>
<body>
<div class="container-stage">
  <div class="container-art">
    <img id="containerImage" class="container-image vhouse-frame-art" src="assets/Vcontainer.png" alt="VHouse Container" draggable="false">
    <div id="journeyContent" class="journey-content vhouse-frame-content"></div>
  </div>
  <div id="containerMessage" style="display:none;width:100%;height:100%" data-header="" data-title="" data-info=""></div>


</div>
<script src="assets/vhouse-message.js"></script>
<script src="assets/vhouse-journey.js"></script>
<script>
if (document.documentElement.classList.contains("journey-mode")) {
  VHouseJourney.load(document.getElementById("journeyContent"), {embedded:true});
}
if (document.documentElement.classList.contains("message-mode")) {
  document.getElementById("containerImage").style.display = "none";
  const host = document.getElementById("containerMessage");
  host.style.display = "block";
  const params = new URLSearchParams(location.search);
  VHouseMessage.set(host, {
    header: params.get("header") || "",
    title: params.get("title") || "",
    info: params.get("info") || ""
  });
}


</script>
</body>
</html>
