<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHouse Container</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}
.container-stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container-image {
  display: block;
  width: 100%;
  height: auto;
  max-height: 100%;
  object-fit: contain;
  border: 3px solid white;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.85);
  user-select: none;
  -webkit-user-drag: none;
}
</style>
</head>
<body>
<div class="container-stage">
  <img class="container-image" src="assets/Vcontainer.png" alt="VHouse Container" draggable="false">
</div>
</body>
</html>
