<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHouse Container</title>
<script>
if (new URLSearchParams(location.search).get("mode") === "message") {
  document.documentElement.classList.add("message-mode");
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}
.container-stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container-image {
  display: block;
  width: 100%;
  height: auto;
  max-height: 100%;
  object-fit: contain;
  border: 3px solid white;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.85);
  user-select: none;
  -webkit-user-drag: none;
}
/* RESIZE THE SAME IMAGE FOR MESSAGES */
.message-mode .container-image {
  height: 100%;
  max-height: none;
  object-fit: fill;
}
</style>
</head>
<body>
<div class="container-stage">
  <img id="containerImage" class="container-image" src="assets/Vcontainer.png" alt="VHouse Container" draggable="false">
  <script>
  if (document.documentElement.classList.contains("message-mode")) {
    const image = document.getElementById("containerImage");
    image.src = "assets/Message Frame.png";
    image.alt = "VHouse Message Frame";
  }
  </script>
</div>
</body>
</html>
