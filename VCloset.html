<!DOCTYPE html>
<html lang="en">

if (performance.getEntriesByType("navigation").some(entry => entry.type === "reload")) {
  window.location.replace("./startup.html");
}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCloset — VHouse</title>
<link rel="stylesheet" href="assets/vhouse-buttons.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
.rotate-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  color: #fff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 24px;
}
.rotate-icon { font-size: 64px; }
.rotate-screen h2 { font-size: 24px; }
.rotate-screen p { font-size: 16px; color: #bbb; }
@media (orientation: portrait) {
  .rotate-screen { display: flex; }
  .game-container { display: none !important; }
}
.game-container {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.map-container {
  position: relative;
  width: min(100vw, 200dvh);
  aspect-ratio: 2 / 1;
  flex-shrink: 0;
  container-type: inline-size;
}
.game-map {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
.back-button { position:absolute; left:1.5%; top:50%; transform:translateY(-50%); z-index:10; }
/* Three centered VCard frames, independent of the background sizing. */
.closet-showcase {
  position: absolute;
  left: 9%;
  top: 8%;
  width: 82%;
  height: 64%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.5%;
  z-index: 2;
}
.closet-slot .closet-card-host {
  position:absolute;
  left:17.5%;
  top:16.8%;
  width:65%;
  max-height:67%;
  pointer-events:none;
  overflow:hidden;
}
.carousel-prev { left:12%; }
.carousel-next { right:12%; }
/* Selection is not assignment. A single fixed bar stays inside the game stage. */
.closet-assignment {
  position:absolute;
  z-index:6;
  left:21%;
  top:68%;
  width:58%;
  height:7%;
  min-height:0;
  display:flex;
  align-items:stretch;
  gap:.5cqw;
  color:#fff;
  font:700 1.13cqw Arial,sans-serif;
}
.closet-assignment .closet-assignment-info {
  flex:1 1 0;
  min-width:0;
  padding:.35cqw .7cqw;
  border:1px solid #ae7a34;
  border-radius:.45cqw;
  background:#160d27e8;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.4cqw;
  white-space:nowrap;
}
.closet-assignment .closet-assignment-info strong {
  color:#ffdd94;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.closet-assignment .closet-confirm {
  flex:0 0 28%;
  min-width:0;
  padding:0 .35cqw;
  border:2px solid #ffb62d;
  border-radius:.45cqw;
  background:#3d2352;
  color:#fff0bf;
  font:900 1.05cqw Arial,sans-serif;
  white-space:nowrap;
  cursor:pointer;
}
.closet-assignment .closet-confirm:not(:disabled):hover,
.closet-assignment .closet-confirm:not(:disabled):focus-visible {
  background:#5d3683;
  box-shadow:0 0 1cqw #ffb62d88;
}
 .closet-assignment .closet-confirm:disabled {
  opacity:.55;
  cursor:default;
}
.closet-slot{position:relative}
.closet-card-status{
  position:absolute;left:50%;bottom:4%;transform:translateX(-50%);
  z-index:8;max-width:88%;padding:.32cqw .55cqw;
  border:1px solid #c18e4d;border-radius:.35cqw;
  background:#170e25ed;color:#ffe2ac;
  font:900 .78cqw Arial,sans-serif;letter-spacing:.04em;
  line-height:1.15;text-align:center;white-space:nowrap;
  pointer-events:none;text-shadow:0 1px 2px #000;
}
.closet-card-status[data-status="ON_JOURNEY"]{color:#a9e9ff;border-color:#62b8d5}
.closet-card-status[data-status="ON_RAID"]{color:#ffd59d;border-color:#cf9556}
.closet-card-status[data-status="RESULTS_READY"]{color:#b5ffe0;border-color:#70d8a9}
.closet-stats-overlay{
  position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.48);
}
.closet-stats-overlay[hidden]{display:none}
.closet-stats-window{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:80%;height:84%;min-width:0;min-height:0;
}
.closet-stats-content{width:100%;height:100%;min-width:0;min-height:0}
/* Closet assignment only: Recall-style mechanical button and decorative energy layer. */
.closet-active-fx{position:relative;flex:0 0 28%;min-width:0;height:100%;isolation:isolate}
.closet-active-fx #confirmPlaceholder{display:block;width:100%;height:100%}
#confirmPlaceholder{position:relative;z-index:1;background:linear-gradient(180deg,#ffe9b2 0%,#e6bf80 48%,#c89b5b 49%,#b6894e 100%);color:#281e28;border:1px solid #ffe6b5;box-shadow:0 3px 0 #80633f,0 4px 0 #f5d49b,0 5px 8px #0008,inset 0 2px 1px #fff9;transition:transform .12s,box-shadow .12s;isolation:isolate}
#confirmPlaceholder::before{content:"";position:absolute;inset:3px;border:1px solid #8b673c;border-radius:3px;pointer-events:none}
#confirmPlaceholder:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #80633f,0 6px 0 #f5d49b,0 0 15px #f5d49b88,inset 0 2px 1px #fff9}
#confirmPlaceholder:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #80633f,0 0 12px white}
.closet-active-energy{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:visible;border-radius:7px}
.closet-active-edge{position:absolute;inset:-2px;border-radius:8px;padding:2px;overflow:hidden;opacity:0;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude}
.closet-active-edge::before{content:"";position:absolute;inset:-500%;background:conic-gradient(#45dfff,#39ff88,#fff,#ffb52e,#ff446f,#ff54d5,#b46aff,#45dfff)}
.closet-active-zaps{position:absolute;inset:-22px -6px;width:calc(100% + 12px);height:calc(100% + 44px);overflow:visible;opacity:0}
.closet-active-zaps path{fill:none;stroke-width:.65;vector-effect:non-scaling-stroke;stroke-dasharray:180;filter:drop-shadow(0 0 3px currentColor)}
.closet-active-fx.is-energized #confirmPlaceholder{opacity:1;transform:translateY(2px);color:white;background:linear-gradient(135deg,#60447d,#211b30 55%,#49384f);border-color:white;box-shadow:0 2px 0 #887450,0 0 10px white,0 0 18px #b46aff88,inset 0 0 12px #45dfff55;text-shadow:0 0 5px white;animation:closet-active-kick .35s ease-out}
.closet-active-fx.is-energized #confirmPlaceholder::before{border-color:#f5d49b}
.closet-active-fx.is-energized .closet-active-edge{opacity:1}
.closet-active-fx.is-energized .closet-active-edge::before{animation:closet-active-spin 1s linear infinite}
.closet-active-fx.is-energized .closet-active-zaps{opacity:1}
.closet-active-fx.is-energized .closet-active-zaps path{animation:closet-active-zap .7s ease-out both}
@keyframes closet-active-spin{to{transform:rotate(360deg)}}
@keyframes closet-active-zap{0%{stroke-dashoffset:180;opacity:1}20%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes closet-active-kick{0%{transform:translateY(2px)}35%{transform:translateY(-3px);box-shadow:0 0 12px white,0 0 20px #45dfff}100%{transform:translateY(2px)}}
@media(prefers-reduced-motion:reduce){#confirmPlaceholder,.closet-active-fx.is-energized #confirmPlaceholder{animation:none;transition:none;transform:none}.closet-active-energy{display:none}}

</style>

<script>
(() => {
  // One store drives the Closet, Creator, and Player UI.
  const store = VHouseCardStore;
  let items = [];
  function refreshItems() {
    const cards = store.getCards();
    items = cards.length ? cards.concat(Array(Math.max(0, 3 - cards.length)).fill(null)) : [null, null, null];
  }
  refreshItems();
  const slots = [...document.querySelectorAll(".closet-slot")];
  const showcase = document.getElementById("closetShowcase");
  const messageHost = document.getElementById("closetMessage");
  const activeName = document.getElementById("closetActiveName");
  const selectedName = document.getElementById("closetSelectedName");
  const confirmButton = document.getElementById("confirmPlaceholder");
  let selected = 0;
  let assigning = false;
  let firstLoaded = false;
  const statsOverlay = document.getElementById("closetStatsOverlay");
  const statsContent = document.getElementById("closetStatsContent");
  let statsCard = null;
  let statsPanel = null;
  let statsLoadSequence = 0;
  const HISTORY_PAGE_SIZE=10;
  let historyPage=0;
  let historyCount=0;
  let historyLoading=false;
  let statsClient=null;
  let statsPlayerId=null;

  function statField(id,value){
    const el=statsPanel?.querySelector('[data-stat-field="'+id+'"]');
    if(el)el.textContent=value===null||value===undefined||value===""?"—":String(value);
  }
  function durationText(seconds){
    const n=Math.max(0,Math.floor(Number(seconds)||0));
    const hours=Math.floor(n/3600),minutes=Math.floor(n%3600/60),secs=n%60;
    return hours?hours+"h "+String(minutes).padStart(2,"0")+"m":
      minutes+"m "+String(secs).padStart(2,"0")+"s";
  }
  function recordElapsed(record){
    const start=Date.parse(record.started_at);
    let end=Date.parse(record.completed_at||record.ends_at);
    if(record.status==="ON_JOURNEY")
      end=Math.min(Date.now(),Number.isFinite(Date.parse(record.ends_at))?Date.parse(record.ends_at):Date.now());
    if(!Number.isFinite(start)||!Number.isFinite(end))return Number(record.duration_seconds)||0;
    return Math.max(0,Math.round((end-start)/1000));
  }
  function recordLoot(record){
    const batches=record.snapshot?.rewardBatches;
    if(batches&&typeof batches==="object"&&Object.keys(batches).length)return batches;
    const rewards=record.rewards||{};
    return {
      IGM:Number(rewards.IGM||0)/100,
      SCRAP:Number(rewards.SCRAP||0),
      CRYPTO:Number(rewards.CRYPTO||0)/.10
    };
  }
  function displayCount(value){
    return Number(value||0).toLocaleString(undefined,{maximumFractionDigits:2});
  }
  // USD equivalents use only the existing Journey bag values.
  function earnedBags(value){
    const count=Number(value);
    return Number.isSafeInteger(count)&&count>0?count:0;
  }
  function earningsCents(scraps,crypto){
    return 25*earnedBags(scraps)+10*earnedBags(crypto);
  }
  function earningsUsd(cents){
    return "$"+(cents/100).toFixed(2)+" USD";
  }
  function recordEarningsCents(record){
    // Completed/ready Journeys already carry the authoritative reward bag tally.
    const batches=record.snapshot?.rewardBatches;
    if(record.status!=="ON_JOURNEY"&&batches&&typeof batches==="object"&&
       Object.keys(batches).length){
      return earningsCents(batches.SCRAP,batches.CRYPTO);
    }
    // While travelling, only completed winning encounters have earned rewards.
    const results=Array.isArray(record.encounter_results)?record.encounter_results:
      Array.isArray(record.snapshot?.results)?record.snapshot.results:[];
    let scraps=0,crypto=0;
    for(const result of results){
      if(result?.won!==true)continue;
      const rewards=Array.isArray(result.rewards)?result.rewards:
        result.reward&&typeof result.reward==="object"?[result.reward]:[];
      for(const reward of rewards){
        const bags=earnedBags(reward?.batches??1);
        if(reward?.item==="SCRAP")scraps+=bags;
        else if(reward?.item==="CRYPTO"&&["SOL","AWT"].includes(reward.token))
          crypto+=bags;
      }
    }
    return earningsCents(scraps,crypto);
  }
  function showSummary(summary){
    statField("journeys",displayCount(summary.journeys));
    statField("completed",displayCount(summary.completed));
    statField("wins",displayCount(summary.wins));
    statField("losses",displayCount(summary.losses));
    statField("time",durationText(summary.seconds));
    const stageMap=new Map((summary.stages||[]).map(entry=>[Number(entry.stage),entry]));
    for(let stage=1;stage<=10;stage++){
      const item=stageMap.get(stage)||{};
      const host=statsPanel.querySelector('[data-stage="'+stage+'"]');
      if(host){
        host.querySelector("strong").textContent=durationText(item.seconds||0);
        host.querySelector("small").textContent=displayCount(item.journeys||0)+" JOURNEYS";
        host.dataset.visited=Number(item.journeys||0)>0?"true":"false";
      }
    }
    const loot=summary.loot||{};
    statField("totalEarned",summary.loot
      ?earningsUsd(earningsCents(loot.SCRAP,loot.CRYPTO)):"—");
    for(const item of ["IGM","SCRAP","CRYPTO"]){
      const el=statsPanel.querySelector('[data-loot="'+item+'"]');
      if(el)el.textContent=displayCount(loot[item]);
    }
  }
  function historyMessage(message){
    const host=statsPanel.querySelector("#journeyHistoryRows");
    host.replaceChildren();
    const row=document.createElement("tr"),cell=document.createElement("td");
    cell.colSpan=6;cell.textContent=message;row.append(cell);host.append(row);
  }
  function updateHistoryPager(){
    const pages=Math.max(1,Math.ceil(historyCount/HISTORY_PAGE_SIZE));
    statsPanel.querySelector("#historyPageLabel").textContent=
      "PAGE "+(historyPage+1)+" / "+pages+" · "+displayCount(historyCount)+" JOURNEYS";
    statsPanel.querySelector("#historyPrev").disabled=historyLoading||historyPage===0;
    statsPanel.querySelector("#historyNext").disabled=historyLoading||historyPage>=pages-1;
  }
  async function loadHistoryPage(ticket=statsLoadSequence){
    if(!statsClient||!statsCard||ticket!==statsLoadSequence)return;
    historyLoading=true;
    updateHistoryPager();
    historyMessage("LOADING JOURNEY HISTORY");
    const cardId=String(statsCard.id);
    try{
      const start=historyPage*HISTORY_PAGE_SIZE;
      const {data,error,count}=await statsClient.from("vhouse_journey_records")
        .select("stage_id,status,started_at,ends_at,completed_at,duration_seconds,encounter_results,rewards,snapshot",{count:"exact"})
        .eq("player_id",statsPlayerId).eq("card_id",cardId)
        .order("started_at",{ascending:false})
        .range(start,start+HISTORY_PAGE_SIZE-1);
      if(error)throw error;
      if(ticket!==statsLoadSequence)return;
      historyCount=count||0;
      const host=statsPanel.querySelector("#journeyHistoryRows");
      host.replaceChildren();
      for(const record of data||[]){
        const results=Array.isArray(record.encounter_results)?record.encounter_results:[];
        const wins=results.filter(result=>result?.won).length;
        const losses=results.filter(result=>result&&result.won===false).length;
        const loot=recordLoot(record);
        const row=document.createElement("tr");
        const values=[
          record.started_at?new Date(record.started_at).toLocaleDateString():"—",
          "STAGE "+record.stage_id,
          durationText(recordElapsed(record)),
          wins+" W / "+losses+" L",
          record.status==="CONFIRMED"
            ?Object.entries(loot).filter(([,value])=>Number(value)>0)
              .map(([item,value])=>displayCount(value)+" "+(item==="IGM"?"IGM BAG":item)).join(" · ")||"—"
            :"PENDING",
          earningsUsd(recordEarningsCents(record))
        ];
        for(const [index,value] of values.entries()){
          const cell=document.createElement("td");
          if(index===3){
            const win=document.createElement("span");
            win.className="history-win";win.textContent=wins+" W";
            const separator=document.createTextNode(" / ");
            const loss=document.createElement("span");
            loss.className="history-loss";loss.textContent=losses+" L";
            cell.append(win,separator,loss);
          }else{
            cell.textContent=value;
            if(index===1)cell.className="history-stage";
            if(index===2)cell.className="history-time";
            if(index===4)cell.className=record.status==="CONFIRMED"?"history-loot":"history-pending";
            if(index===5)cell.className="history-earned";
          }
          row.append(cell);
        }
        host.append(row);
      }
      if(!data?.length)historyMessage("NO JOURNEY HISTORY ON THIS PAGE");
    }catch(error){
      if(ticket===statsLoadSequence)historyMessage("JOURNEY HISTORY UNAVAILABLE: "+(error.message||"LOAD FAILED"));
    }finally{
      if(ticket===statsLoadSequence){historyLoading=false;updateHistoryPager();}
    }
  }
  function busyLabel(state){
    return state.status==="ON_RAID"?"ON RAID":
      state.status==="ON_JOURNEY"?"ON JOURNEY":
      state.status==="RESULTS_READY"?"RESULTS READY":"";
  }
  function fillCardStats(card){
    if(!statsPanel||!card)return;
    const state=store.getStatus(card.id);
    const active=card.id===store.getActiveId();
    const image=statsPanel.querySelector("#vcardImage");
    if(image.dataset.cardId!==String(card.id)){
      image.dataset.cardId=String(card.id);
      image.replaceChildren();
      const preview=document.createElement("div");
      preview.className="record-vcard-preview";
      image.append(preview);
    }
    const preview=image.querySelector(".record-vcard-preview");
    if(preview)VHouseVCard.render(preview,card);
    statField("cardId",card.id);
    statField("name",card.name||"VCard");
    statField("status",(active?"ACTIVE":"AVAILABLE")+
      (busyLabel(state)?" · "+busyLabel(state):""));
    const paint=visual=>{statField("name",visual.name||"VCard");statField("team",visual.team);statField("level",visual.level);};
    if(window.VHouseNFTVisuals)window.VHouseNFTVisuals.bind(image,card,paint);else paint(card);
    statField("atk",card.atk);
    statField("def",card.def);
    for(const [kind,field] of [["atk","amalieAtk"],["def","amalieDef"]]){
      const amount=Number(card[kind==="atk"?"amalieBonusAtk":"amalieBonusDef"])||0;
      const node=statsPanel.querySelector('[data-stat-field="'+field+'"]');
      if(node){
        node.textContent=amount>0?"+"+amount.toLocaleString(undefined,{maximumFractionDigits:1}):"";
        node.parentElement.style.display=amount>0?"":"none";
      }
    }
    statField("speed",card.speed);
    statField("luck",card.luck);

  }

    const vcardStyles=document.createElement("link");

    });
    panel.querySelector(".nav").insertBefore(journeyButton,panel.querySelector("#closeCardStats"));
    panel.querySelector("#closeCardStats").addEventListener("click",closeCardStats);
    panel.querySelector("#historyPrev").addEventListener("click",()=>{
      if(historyLoading||historyPage<=0)return;
      historyPage--;void loadHistoryPage();
    });
    panel.querySelector("#historyNext").addEventListener("click",()=>{
      if(historyLoading||(historyPage+1)*HISTORY_PAGE_SIZE>=historyCount)return;
      historyPage++;void loadHistoryPage();
    });
    statsPanel=panel;
  }
  function closeCardStats(){
    statsOverlay.hidden=true;statsCard=null;statsClient=null;++statsLoadSequence;
  }
  async function openCardStats(card){
    if(!card)return;
    statsCard=card;statsOverlay.hidden=false;
    const ticket=++statsLoadSequence;
    historyPage=0;historyCount=0;historyLoading=false;
    try{
      await ensureStatsPanel();
      if(ticket!==statsLoadSequence)return;
      fillCardStats(card);
      const user=window.VHouseAuth?.getUser?.();
      if(!user){
        showSummary({});
        historyMessage("SIGN IN TO VIEW JOURNEY HISTORY");
        updateHistoryPager();
        return;
      }
      statsClient=window.VHouseAuth.getClient();
      statsPlayerId=user.id;
      const {data,error}=await statsClient.rpc("vhouse_vcard_journey_summary",{p_card_id:String(card.id)});
      if(error)throw error;
      if(ticket!==statsLoadSequence)return;
      showSummary(data||{});
      const loot=data?.loot||{};
      statsPanel.querySelector("#totalLootBatches").textContent=
        displayCount(Number(loot.IGM||0)+Number(loot.SCRAP||0)+Number(loot.CRYPTO||0));
      await loadHistoryPage(ticket);
      if(ticket!==statsLoadSequence)return;
      fillCardStats(card);
    }catch(error){
      console.error("VCard stats:",error);
      if(ticket===statsLoadSequence&&statsPanel){
        historyMessage("JOURNEY STATS UNAVAILABLE: "+(error.message||"LOAD FAILED"));
        updateHistoryPager();
      }
    }
  }

  function render() {
    refreshItems();
    const activeIndex = items.findIndex(card => card?.id === store.getActiveId());
    if (activeIndex >= 0 && selected >= items.length) selected = activeIndex;
    selected = ((selected % items.length) + items.length) % items.length;
    slots.forEach((slot, position) => {
      const offset = position - 1;
      const index = (selected + offset + items.length) % items.length;
      const card = items[index];
      let host = slot.querySelector(".closet-card-host");
      if (!host) {
        host = document.createElement("div");
        host.className = "closet-card-host";
        slot.appendChild(host);
      }
      VHouseVCard.render(host, card);
      let stateBadge=slot.querySelector(".closet-card-status");
      if(!stateBadge){stateBadge=document.createElement("span");stateBadge.className="closet-card-status";slot.append(stateBadge);}
      if(card){
        const state=store.getStatus(card.id),isActive=card.id===store.getActiveId();
        const label=(isActive?"ACTIVE":"AVAILABLE")+
          (busyLabel(state)?" · "+busyLabel(state):"");
        stateBadge.textContent=label;
        stateBadge.dataset.status=state.status;
        stateBadge.hidden=false;
      }else{stateBadge.textContent="";stateBadge.hidden=true;}
      slot.setAttribute("aria-label", card ? String(card.name) + (offset === 0 ? ", selected" : ", select") : "Empty VCard slot");
      slot.classList.toggle("is-center", offset === 0);
      slot.setAttribute("aria-current", String(offset === 0));
    });
    const current = items[selected];
    const active = store.getActive();
    const activeState=active?store.getStatus(active.id).status:"AVAILABLE";
    activeName.textContent=active
      ?String(active.name||"VCard")+
        (busyLabel({status:activeState})?" · "+busyLabel({status:activeState}):"")
      :"NONE";
    activeName.title = activeName.textContent;
    selectedName.textContent = current ? String(current.name || "VCard") : "NONE";
    selectedName.title = selectedName.textContent;
    const currentState=current?store.getStatus(current.id).status:"AVAILABLE";
    const currentLocked=currentState!=="AVAILABLE";
    confirmButton.disabled=assigning||!current||current.id===store.getActiveId()||currentLocked;
    confirmButton.textContent=assigning?"SAVING…":
      current?.id===store.getActiveId()?"ACTIVE ✓":
      currentState==="ON_JOURNEY"?"ON JOURNEY":
      currentState==="ON_RAID"?"ON RAID":
      currentState==="RESULTS_READY"?"RESULTS READY":"SET AS ACTIVE";
    VHouseMessage.set(messageHost, {
      header: current ? (current.id === store.getActiveId() ? "ACTIVE VCARD" : "VIEWING VCARD") : "EMPTY SLOT",
      title: current ? String(current.name || "VCard") : "VCard Slot",
      info: current ? String(current.description || "No description entered.") : "Finished VCards and outfits can be viewed here."
    });
  }
  async function confirmSelection() {
    if (assigning) return;
    const card = items[selected];
    if (!card || card.id === store.getActiveId()) return;
    assigning = true;
    render();
    let failed = null;
    try {
      await store.setActive(card.id);
    } catch (error) {
      failed = error;
      console.error("VCloset active VCard assignment:",error);
    } finally {
      assigning = false;
      render();
    }
    if (failed) {
      VHouseMessage.set(messageHost, {
        header:"ASSIGNMENT FAILED",
        title:card.name || "VCard",
        info:failed.message || "Could not assign this VCard."
      });
    } else {
      VHouseMessage.set(messageHost, {
        header:"ACTIVE VCARD UPDATED",
        title:card.name || "VCard",
        info:"This VCard is now active."
      });
    }
  }
/* Decorative Closet assignment button animation; no activation state changes. */
{
  const button=confirmButton,visual=button.closest(".closet-active-fx");
  if(visual){
    let animationTimer;
    button.addEventListener("click",()=>{
      clearTimeout(animationTimer);
      visual.classList.remove("is-energized");
      void visual.offsetWidth;
      visual.classList.add("is-energized");
      animationTimer=setTimeout(()=>visual.classList.remove("is-energized"),850);
    },{capture:true});
  }
}

  confirmButton.addEventListener("click", () => { void confirmSelection(); });
  function move(direction) {
    if (assigning) return;
    selected = (selected + direction + items.length) % items.length;
    render();
  }
  document.querySelector(".carousel-prev").addEventListener("click", () => move(-1));
  document.querySelector(".carousel-next").addEventListener("click", () => move(1));
  slots.forEach(slot => slot.addEventListener("click", () => {
    const index=(selected+Number(slot.dataset.position)+items.length)%items.length;
    const card=items[index];
    if(!card)return;
    selected=index;
    render();
    void openCardStats(card);
  }));
  statsOverlay.addEventListener("click",event=>{
    if(event.target===statsOverlay)closeCardStats();
  });
  document.addEventListener("keydown",event=>{
    if(event.key==="Escape"&&!statsOverlay.hidden)closeCardStats();
  });
  let startX = null;
  showcase.addEventListener("pointerdown", event => { startX = event.clientX; });
  showcase.addEventListener("pointerup", event => {
    if (startX === null) return;
    const distance = event.clientX - startX;
    startX = null;
    if (Math.abs(distance) > 35) {
      // Ignore the click synthesized after a swipe.
      ignoreNextClick = true;
      move(distance < 0 ? 1 : -1);
    }
  });
  let ignoreNextClick = false;
  showcase.addEventListener("click", event => {
    if (ignoreNextClick) {
      event.stopPropagation();
      event.preventDefault();
      ignoreNextClick = false;
    }
  }, true);
  let lastWheel = 0;
  showcase.addEventListener("wheel", event => {
    event.preventDefault();
    const now = Date.now();
    if (now - lastWheel < 280) return;
    lastWheel = now;
    move((event.deltaX || event.deltaY) > 0 ? 1 : -1);
  }, {passive: false});
  document.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft") move(-1);
    if (event.key === "ArrowRight") move(1);
  });
  store.subscribe(() => {
    if(statsCard&&statsPanel&&!statsOverlay.hidden){
      statsCard=store.getCards().find(card=>card?.id===statsCard.id)||statsCard;
      fillCardStats(statsCard);
      const preview=statsPanel.querySelector(".record-vcard-preview");
      if(preview)VHouseVCard.render(preview,statsCard);
    }
    // On the first Supabase load, show the active card in the center.
    // After that, browsing must never be overridden by an active-card update.
    refreshItems();
    if (!firstLoaded && items.some(Boolean)) {
      const index = items.findIndex(card => card?.id === store.getActiveId());
      selected = index >= 0 ? index : 0;
      firstLoaded = true;
    }
    render();
  });
  render();
  // Town Journey Billboard opens the existing stats panel for the assigned VCard.
  if (new URLSearchParams(location.search).get("stats")==="1") {
    let opened=false;
    async function openActiveStats(){
      if(opened)return;
      await window.VHouseAuth.ready;
      await store.ready();
      if(opened)return;
      const card=store.getActive();
      if(!card)return;
      opened=true;
      const index=items.findIndex(item=>item?.id===card.id);
      if(index>=0)selected=index;
      render();
      void openCardStats(card);
    }
    const stop=store.subscribe(()=>{
      if(opened){stop();return;}
      if(store.getActive()){stop();void openActiveStats().catch(error=>console.warn("Journey Billboard:",error));}
    });
    void openActiveStats().catch(error=>console.warn("Journey Billboard:",error));
  }
})();
