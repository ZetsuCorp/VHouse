<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCloset — VHouse</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
.rotate-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  color: #fff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
  padding: 24px;
}
.rotate-icon { font-size: 64px; }
.rotate-screen h2 { font-size: 24px; }
.rotate-screen p { font-size: 16px; color: #bbb; }
@media (orientation: portrait) {
  .rotate-screen { display: flex; }
  .game-container { display: none !important; }
}
.game-container {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.map-container {
  position: relative;
  width: min(100vw, 200dvh);
  aspect-ratio: 2 / 1;
  flex-shrink: 0;
  container-type: inline-size;
}
.game-map {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
.back-button {
  position: absolute;
  left: 1.5%;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 8%;
  padding: .7cqw 1cqw;
  border: 2px solid #ffb62d;
  border-radius: .6cqw;
  background: #160d27;
  color: #fff;
  box-shadow: 0 0 1cqw #ff9d2966;
  text-decoration: none;
  font-size: 1.25cqw;
  font-weight: 900;
  letter-spacing: .07em;
}
.back-button:hover,
.back-button:focus-visible {
  background: #36204e;
  box-shadow: 0 0 1.5cqw #ffb62d99;
}
</style>
</head>
<body>
<div class="rotate-screen">
  <div class="rotate-icon">↻</div>
  <h2>Rotate Your Phone</h2>
  <p>Please turn your device sideways to play.</p>
</div>
<main class="game-container">
  <div class="map-container">
    <img class="game-map" src="assets/VCloset.png" alt="VCloset Interior" draggable="false">
    <a class="back-button" href="./Vhouse.html">← BACK</a>
  </div>
</main>
</body>
</html>
