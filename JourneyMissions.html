<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHouse Journey Missions</title>
<link rel="stylesheet" href="assets/vhouse-layout.css">
<link rel="stylesheet" href="assets/vhouse-journey.css">
</head>
<body>
<main class="game-container">
  <div class="map-container" style="overflow:hidden">
    <div class="vhouse-journey" data-vhouse-journey-root>
<header class="header">
    <small>ZETSUMETSU · VHOUSE</small>
    <h1>JOURNEY MISSIONS</h1>
    <div class="subtitle" id="subtitle">
      Choose your VCard to begin a Journey
    </div>
  </header>

  <!-- THREE RPS CARDS -->

  <section class="card-selection" id="cardSelection">

    <button class="rps-card" data-letter="R">
      <div class="emblem">R</div>
      <div class="card-name">ROCK</div>
      <div class="card-label">SELECT VCARD</div>
    </button>

    <button class="rps-card" data-letter="P">
      <div class="emblem">P</div>
      <div class="card-name">PAPER</div>
      <div class="card-label">SELECT VCARD</div>
    </button>

    <button class="rps-card" data-letter="S">
      <div class="emblem">S</div>
      <div class="card-name">SCISSORS</div>
      <div class="card-label">SELECT VCARD</div>
    </button>

  </section>

  <!-- TEN MISSION STAGES -->

  <section class="mission-card" id="missionCard">

    <div class="mission-title" id="missionTitle">
      SELECT MISSION STAGE
    </div>

    <div class="stage-grid" id="stageGrid"></div>

  </section>

  <!-- MISSION INFO -->

  <div class="mission-detail" id="missionDetail">

    <div class="detail-title" id="detailTitle"></div>

    <div class="detail-copy" id="detailCopy"></div>

    <button class="start-button" id="startButton">
      START JOURNEY
    </button>

  </div>

  <!-- NAVIGATION -->

  <footer class="footer">

    <button class="back-button" id="backButton">
      ← BACK
    </button>

    <div class="status" id="status">
      VCARD SELECTION · 0 / 10 STAGES
    </div>

  </footer>
    </div>
  </div>
</main>
<script src="assets/vhouse-journey.js"></script>
<script>VHouseJourney.init(document.querySelector("[data-vhouse-journey-root]"));</script>
</body>
</html>
