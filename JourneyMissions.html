
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VHouse Journey Missions</title>
<script>
if (new URLSearchParams(location.search).get("embedded") === "1") {
  document.documentElement.classList.add("embedded");
}
</script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.game-container {
  width: 100vw;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.map-container {
  position: relative;
  width: min(100vw, 200dvh);
  aspect-ratio: 2 / 1;
  flex-shrink: 0;
  container-type: inline-size;
  overflow: hidden;
  background:
    radial-gradient(ellipse at center, #263c51, #0d1a2a 60%, #050a13);
  border: 1px solid #496579;
}

.header {
  position: absolute;
  top: 5%;
  width: 100%;
  text-align: center;
}

.header small {
  color: #b5dbed;
  letter-spacing: .3em;
  font-size: 1.1cqw;
}

.header h1 {
  font-family: Georgia, serif;
  font-size: 3.4cqw;
  color: #ffe2a0;
  letter-spacing: .1em;
  text-shadow: 0 0 16px #e9af56;
}

.subtitle {
  color: #bfd4e4;
  font-size: 1.2cqw;
  margin-top: .5%;
}

/* Fit the mission UI inside the artwork's white content rectangle. */
html.embedded { width: 100%; height: 100%; }
html.embedded body { width: 100%; height: 100%; min-height: 0; }
html.embedded .game-container { width: 100%; height: 100%; }
html.embedded .map-container { width: 100%; height: 100%; aspect-ratio: auto; border: 0; }


/* R P S CARD SELECTION */

.card-selection {
  position: absolute;
  top: 29%;
  left: 13%;
  width: 74%;
  height: 57%;
  display: flex;
  justify-content: center;
  gap: 4%;
}

.rps-card {
  flex: 1;
  min-width: 0;
  border: 1px solid #a78a60;
  border-radius: 8px;
  background: linear-gradient(
    145deg, #233449, #101a2b 67%, #14283a
  );
  color: white;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 7px 18px #0008;
  transition: transform .15s, box-shadow .15s;
}

.rps-card:hover {
  transform: translateY(-4px);
  border-color: #ffe39c;
  box-shadow: 0 0 20px #f9cf7866;
}

.rps-card:active {
  transform: scale(.96);
}

.emblem {
  width: 8cqw;
  height: 8cqw;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #d8b87b;
  border-radius: 50%;
  font-family: Georgia, serif;
  font-size: 5.5cqw;
  color: #ffe6af;
  background: radial-gradient(
    circle, #55677e, #1c2938 70%
  );
  box-shadow: 0 0 16px #d9bd7460;
}

.card-name {
  margin-top: 5%;
  color: #edcf96;
  letter-spacing: .15em;
  font-size: 1.5cqw;
  font-weight: bold;
}

.card-label {
  color: #acbbcd;
  font-size: 1cqw;
  margin-top: 2%;
}

/* SINGLE MISSION CARD */

.mission-card {
  display: none;
  position: absolute;
  top: 22%;
  left: 20%;
  width: 60%;
  height: 67%;
  border: 1px solid #c5a773;
  border-radius: 8px;
  background: linear-gradient(
    145deg, #23384b, #0b1929
  );
  box-shadow:
    0 0 30px #0009,
    inset 0 0 0 4px #0e2131;
  padding: 2% 3%;
  flex-direction: column;
  gap: 5%;
}

.mission-title {
  font-family: Georgia, serif;
  text-align: center;
  color: #ffdfa2;
  font-size: 2cqw;
  font-weight: bold;
}

.stage-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: .6cqw;
}

.stage {
  background: linear-gradient(#1c3850, #0c1a2b);
  border: 1px solid #506c82;
  border-radius: 5px;
  color: #d9e8f2;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: .3cqw;
  font-size: 1cqw;
}

.stage strong {
  font-size: 2.3cqw;
  color: #ffdc92;
}

.stage:hover {
  border-color: #ffda94;
  background: #29465e;
}

.stage.selected {
  border-color: #f8df96;
  background: #486146;
  box-shadow: 0 0 12px #e5c26f44;
}

/* FOOTER */

.footer {
  position: absolute;
  left: 2.5%;
  right: 2.5%;
  bottom: 3%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.back-button {
  border: 1px solid #8a9fb0;
  background: #101e2b;
  color: #d9e9f3;
  border-radius: 4px;
  padding: .6cqw 1.4cqw;
  font-size: 1.2cqw;
  cursor: pointer;
}

.status {
  color: #c7d6df;
  font-size: 1.1cqw;
}

/* MISSION DETAILS */

.mission-detail {
  display: none;
  position: absolute;
  bottom: 12%;
  left: 22%;
  width: 56%;
  padding: 1.4cqw;
  background: #0d1928;
  border: 1px solid #657f91;
  border-radius: 6px;
  text-align: center;
  z-index: 5;
  box-shadow: 0 0 25px #000;
}

.detail-title {
  color: #ffdfa2;
  font-size: 1.7cqw;
  font-weight: bold;
}

.detail-copy {
  color: #c7d7e5;
  font-size: 1.1cqw;
  margin: 1cqw 0;
}

.start-button {
  padding: .8cqw 2cqw;
  border: 1px solid #b69a61;
  border-radius: 5px;
  background: #5a4a2a;
  color: #ffebc0;
  font-weight: bold;
  font-size: 1.2cqw;
  cursor: pointer;
}

.start-button:hover {
  background: #796638;
}
/* Embedded layout: enlarge mission elements without moving or scaling their regions into each other. */
html.embedded .header {
  top: 6%;
}
html.embedded .header small {
  font-size: 1.21cqw;
  line-height: 1.2;
}
html.embedded .header h1 {
  font-size: 3.74cqw;
  line-height: 1.1;
}
html.embedded .subtitle {
  font-size: 1.32cqw;
  line-height: 1.2;
  margin-top: .7cqw;
}

/* Keep the selection below the heading and above the footer. */
html.embedded .card-selection {
  top: 30.5%;
  left: 9.3%;
  width: 81.4%;
  height: 53.5%;
  gap: 3.2%;
}
html.embedded .emblem {
  width: 8.8cqw;
  height: 8.8cqw;
  font-size: 6.05cqw;
}
html.embedded .card-name { font-size: 1.65cqw; }
html.embedded .card-label { font-size: 1.1cqw; }

/* The stage selector fits the same content area. */
html.embedded .mission-card {
  top: 30.5%;
  left: 9.3%;
  width: 81.4%;
  height: 53.5%;
  padding: 1cqw 1.4cqw;
  gap: .8cqw;
}
html.embedded .mission-title { font-size: 2.2cqw; }
html.embedded .stage { font-size: 1.1cqw; }
html.embedded .stage strong { font-size: 2.53cqw; }

/* When stage details appear, reserve a separate row instead of covering the stage buttons. */
html.embedded .map-container:has(.mission-detail[style*="block"]) .mission-card {
  height: 34%;
}
html.embedded .mission-detail {
  bottom: 13%;
  left: 12%;
  width: 76%;
  padding: .85cqw 1cqw;
}
html.embedded .detail-title { font-size: 1.87cqw; }
html.embedded .detail-copy { font-size: 1.21cqw; margin: .5cqw 0; }
html.embedded .start-button { font-size: 1.32cqw; padding: .5cqw 1.5cqw; }
html.embedded .back-button { font-size: 1.32cqw; }
html.embedded .status { font-size: 1.21cqw; }
</style>
</head>

<body>

<main class="game-container">
<div class="map-container">

  <header class="header">
    <small>ZETSUMETSU · VHOUSE</small>
    <h1>JOURNEY MISSIONS</h1>
    <div class="subtitle" id="subtitle">
      Choose your VCard to begin a Journey
    </div>
  </header>

  <!-- THREE RPS CARDS -->

  <section class="card-selection" id="cardSelection">

    <button class="rps-card" data-letter="R">
      <div class="emblem">R</div>
      <div class="card-name">ROCK</div>
      <div class="card-label">SELECT VCARD</div>
    </button>

    <button class="rps-card" data-letter="P">
      <div class="emblem">P</div>
      <div class="card-name">PAPER</div>
      <div class="card-label">SELECT VCARD</div>
    </button>

    <button class="rps-card" data-letter="S">
      <div class="emblem">S</div>
      <div class="card-name">SCISSORS</div>
      <div class="card-label">SELECT VCARD</div>
    </button>

  </section>

  <!-- TEN MISSION STAGES -->

  <section class="mission-card" id="missionCard">

    <div class="mission-title" id="missionTitle">
      SELECT MISSION STAGE
    </div>

    <div class="stage-grid" id="stageGrid"></div>

  </section>

  <!-- MISSION INFO -->

  <div class="mission-detail" id="missionDetail">

    <div class="detail-title" id="detailTitle"></div>

    <div class="detail-copy" id="detailCopy"></div>

    <button class="start-button" id="startButton">
      START JOURNEY
    </button>

  </div>

  <!-- NAVIGATION -->

  <footer class="footer">

    <button class="back-button" id="backButton">
      ← BACK
    </button>

    <div class="status" id="status">
      VCARD SELECTION · 0 / 10 STAGES
    </div>

  </footer>

</div>
</main>

<script>
const cardSelection =
  document.getElementById("cardSelection");

const missionCard =
  document.getElementById("missionCard");

const missionTitle =
  document.getElementById("missionTitle");

const stageGrid =
  document.getElementById("stageGrid");

const missionDetail =
  document.getElementById("missionDetail");

const detailTitle =
  document.getElementById("detailTitle");

const detailCopy =
  document.getElementById("detailCopy");

const startButton =
  document.getElementById("startButton");

const backButton =
  document.getElementById("backButton");

const status =
  document.getElementById("status");

const subtitle =
  document.getElementById("subtitle");

let selectedLetter = null;
let selectedStage = null;

const missions = [
  {
    time: "30 seconds",
    encounters: "3 hunts",
    reward: "300 IG"
  },
  {
    time: "60 seconds",
    encounters: "4 hunts + 2 fights",
    reward: "500 IG"
  }
];

/* SELECT R, P OR S */

document.querySelectorAll(".rps-card")
  .forEach(card => {

    card.addEventListener("click", () => {

      selectedLetter = card.dataset.letter;
      selectedStage = null;

      cardSelection.style.display = "none";
      missionCard.style.display = "flex";
      missionDetail.style.display = "none";

      missionTitle.textContent =
        selectedLetter + " · SELECT MISSION STAGE";

      subtitle.textContent =
        "Select one of the 10 mission stages";

      status.textContent =
        selectedLetter + " VCARD · 10 STAGES";

      backButton.textContent = "← CHANGE VCARD";

      createStages();

    });

  });

/* GENERATE TEN STAGES */

function createStages() {

  stageGrid.innerHTML = "";

  for (let i = 1; i <= 10; i++) {

    const button = document.createElement("button");

    button.className = "stage";

    button.innerHTML = `
      <span>STAGE</span>
      <strong>${i}</strong>
    `;

    button.addEventListener("click", () => {
      selectStage(i);
    });

    stageGrid.appendChild(button);

  }

}

/* SELECT STAGE */

function selectStage(number) {

  selectedStage = number;

  document.querySelectorAll(".stage")
    .forEach((button, index) => {

      button.classList.toggle(
        "selected",
        index + 1 === number
      );

    });

  detailTitle.textContent =
    "STAGE " + number + " · " + selectedLetter;

  const mission = missions[number - 1];

  if (mission) {

    detailCopy.textContent =
      mission.time + " · " +
      mission.encounters + " · Reward: " +
      mission.reward;

    startButton.disabled = false;

  } else {

    detailCopy.textContent =
      "Mission parameters to be configured.";

    startButton.disabled = true;

  }

  status.textContent =
    selectedLetter + " VCARD · STAGE " + number;

  missionDetail.style.display = "block";

}

/* DEMO START */

startButton.addEventListener("click", () => {

  if (!selectedStage || selectedStage > 2) return;

  detailCopy.textContent =
    "Stage " + selectedStage +
    " selected. Mission execution will be connected next.";

});

/* BACK BUTTON */

backButton.addEventListener("click", () => {

  selectedLetter = null;
  selectedStage = null;

  cardSelection.style.display = "flex";
  missionCard.style.display = "none";
  missionDetail.style.display = "none";

  subtitle.textContent =
    "Choose your VCard to begin a Journey";

  status.textContent =
    "VCARD SELECTION · 0 / 10 STAGES";

  backButton.textContent = "← BACK";

});

</script>

</body>
</html>
