<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VHouse — Raid Egg Game Demo</title>
<style>
:root{--gold:#f8c46b;--violet:#a05bed}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#06040b;color:#ffdfaa;font-family:Arial,Helvetica,sans-serif}
.demo{width:min(1200px,100%);margin:auto;padding:10px}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:0 0 10px}
button{border:1px solid #e5bc70;border-radius:7px;padding:10px 18px;background:#2d193d;color:#ffe3ae;font-size:clamp(11px,1.35vw,16px);font-weight:900;cursor:pointer}
button:hover{background:#512b6b}button:disabled{opacity:.5;cursor:not-allowed}
.arena{position:relative;overflow:hidden;width:100%;aspect-ratio:2/1;min-height:260px;border:2px solid var(--gold);background:#1d102e url("assets/TOWERSELECT.png") center/cover no-repeat;isolation:isolate}
.arena::before{content:"";position:absolute;inset:0;background:rgba(7,3,16,.62)}
.egg-display{position:absolute;inset:2.5% 18%;border:2px solid #f3c47b;border-radius:13px;background:radial-gradient(ellipse at 50% 45%,rgba(116,46,177,.46),rgba(16,6,30,.94) 76%);box-shadow:0 0 25px #c57aff88,inset 0 0 30px #c277ff20;display:flex;align-items:center;flex-direction:column;gap:0;overflow:hidden}
.title{z-index:1;flex:0 0 auto;margin:2.3% 0 0;font:900 clamp(16px,3.3vw,38px) Georgia,serif;letter-spacing:.16em;text-shadow:0 3px 10px black}
.visual{z-index:1;position:relative;flex:1 1 auto;min-height:0;width:90%;display:grid;place-items:center}
.visual::before{content:"";position:absolute;width:52%;height:66%;border-radius:50%;background:radial-gradient(circle,#b971ff5c,transparent 70%);filter:blur(17px)}
.egg-image{display:block;position:relative;max-height:100%;max-width:70%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 0 17px #cd84ff90)}
.egg-image.hit{animation:eggImpact .65s ease both}
.egg-image.broken{animation:eggReveal .75s ease both;filter:drop-shadow(0 0 28px #fccc8f)}
.burst{position:absolute;left:50%;top:46%;width:6%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 18px 13px #d788ff,0 0 50px 28px #b761ee;opacity:0;pointer-events:none}
.burst.hit{animation:eggBurst .8s ease-out both}
.damage{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:clamp(14px,3vw,35px);font-weight:1000;white-space:nowrap;color:#ffdc7c;text-shadow:1px 2px 3px black,0 0 16px #e383fe;opacity:0;z-index:4;pointer-events:none}
.damage.hit{animation:eggDamage 1.35s ease-out both}
.health-label{z-index:1;flex:0 0 auto;font-weight:1000;font-size:clamp(12px,2vw,24px);letter-spacing:.2em;line-height:1.3;color:#ffdd9d}
.health-bar{z-index:1;position:relative;width:87%;height:clamp(27px,4.8vw,52px);margin:1.2% 0 4%;flex:0 0 auto;border-radius:50px;border:3px solid #f4cf86;background:#170923;box-shadow:inset 0 0 11px #000,0 0 19px #ac69e070;overflow:hidden}
.health-fill{position:absolute;inset:0 auto 0 0;width:100%;border-radius:40px;background:linear-gradient(180deg,#f0bdfb 0%,#ac5fdc 35%,#6c309e 77%,#4b1f75 100%);box-shadow:inset 0 2px 7px #fff7,0 0 15px #b56af8}
.health-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff38,transparent 50%,#00000036);pointer-events:none}
.health-count{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(12px,2.1vw,25px);font-weight:1000;font-variant-numeric:tabular-nums;color:#fff3dd;text-shadow:0 2px 4px #110616,0 0 8px #000;z-index:2;white-space:nowrap}
@keyframes eggImpact{0%,100%{transform:translate(0,0) scale(1)}18%{transform:translate(-5px,2px) scale(.96);filter:brightness(1.8)}40%{transform:translate(7px,-2px) scale(1.04)}65%{transform:translate(-4px,1px) scale(.99)}}
@keyframes eggReveal{0%{opacity:.3;transform:scale(.74)}70%{opacity:1;transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes eggBurst{0%{opacity:0;transform:scale(.1)}18%{opacity:1}100%{opacity:0;transform:scale(8)}}
@keyframes eggDamage{0%{opacity:0;transform:translate(-50%,20px) scale(.75)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.2)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-48px)}}
@media(max-width:600px){.demo{padding:5px}.arena{min-height:220px}.egg-display{inset:2% 9%}.health-bar{width:91%;margin-bottom:4%}.egg-image{max-width:75%}button{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<main class="demo">
<div class="controls"><button id="hit" type="button">HIT EGG</button><button id="break" type="button">BREAK EGG</button><button id="reset" type="button">RESET</button></div>
<section class="arena" aria-label="Raid Egg game demo">
<div class="egg-display">
<h1 class="title">EGG</h1>
<div class="visual">
<div class="burst" id="burst"></div>
<img id="egg" class="egg-image" src="assets/Egg.png" alt="Raid egg">
<div class="damage" id="damage" aria-hidden="true"></div>
</div>
<div class="health-label">HEALTH</div>
<div class="health-bar" role="progressbar" aria-label="Egg health" aria-valuemin="0" aria-valuemax="23107920" aria-valuenow="23107920" id="bar">
<div class="health-fill" id="fill"></div>
<div class="health-count" id="hp">23,107,920 / 23,107,920</div>
</div>
</div>
</section>
</main>
<script>
(()=>{
"use strict";
const MAX=23107920,HIT=2243487;
let health=MAX,sequence=0;
const $=id=>document.getElementById(id);
const egg=$("egg"),bar=$("bar"),fill=$("fill"),count=$("hp"),damage=$("damage"),burst=$("burst");
const hit=$("hit"),breakButton=$("break"),reset=$("reset");
const fmt=n=>Math.round(n).toLocaleString("en-US");
function render(value){
const hp=Math.max(0,Math.round(value));
fill.style.width=(hp/MAX*100)+"%";
count.textContent=fmt(hp)+" / "+fmt(MAX);
bar.setAttribute("aria-valuenow",String(hp));
}
function reanimate(el,cls){
el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);
}
function play(amount){
if(health<=0)return;
const from=health,to=Math.max(0,health-amount);
health=to;const token=++sequence;
hit.disabled=true;breakButton.disabled=true;
egg.src="assets/Egg.png";egg.className="egg-image";
damage.textContent="−"+fmt(from-to);
reanimate(egg,"hit");reanimate(damage,"hit");reanimate(burst,"hit");
const ms=1450;let begin=null;
function step(t){
if(token!==sequence)return;
if(begin===null)begin=t;
const progress=Math.min(1,(t-begin)/ms);
const eased=1-Math.pow(1-progress,3);
render(from+(to-from)*eased);
if(progress<1){requestAnimationFrame(step);return;}
render(to);
if(to===0){
egg.src="assets/Eggopen.png";
egg.className="egg-image broken";
}
hit.disabled=false;breakButton.disabled=false;
}
requestAnimationFrame(step);
}
hit.addEventListener("click",()=>play(HIT));
breakButton.addEventListener("click",()=>play(health));
reset.addEventListener("click",()=>{
sequence++;health=MAX;egg.src="assets/Egg.png";egg.className="egg-image";
burst.className="burst";damage.className="damage";damage.textContent="";
hit.disabled=false;breakButton.disabled=false;render(health);
});
render(health);
})();
</script>
</body>
</html>
